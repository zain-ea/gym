/* ---- MONTH CALENDARS ----
   One calendar per month, newest first, Monday-first to match the Week screen.
   A trained day is coloured by routine and taps through to that session. */

const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

function monthCalendars(sessions){
  const wrap = el('div', { class:'sec' });
  const byDate = new Map();
  sessions.forEach(s => byDate.set(s.date, s));

  const today = new Date(); today.setHours(0,0,0,0);
  const todayKey = localDate(today);

  // Every month from the first logged session to the current one.
  const firstKey = sessions[sessions.length-1].date;
  const first = parseDate(firstKey);
  const months = [];
  let y = first.getFullYear(), m = first.getMonth();
  while(y < today.getFullYear() || (y === today.getFullYear() && m <= today.getMonth())){
    months.push({ y, m });
    m++; if(m > 11){ m = 0; y++; }
  }
  months.reverse();

  const routineClass = rid =>
    rid === (S.routines[0] && S.routines[0].id) ? 'a' :
    rid === (S.routines[1] && S.routines[1].id) ? 'b' : 'x';

  months.forEach(({ y, m }) => {
    const cal = el('div', { class:'cal' });
    const daysInMonth = new Date(y, m+1, 0).getDate();

    // Trained vs planned. Planned is the actual count of scheduled training
    // weekdays falling in this month — 4 a week is 18 in some months and 17 in
    // others, so counting beats multiplying. It uses today's schedule, which is
    // the only one on record, so older months are measured against it too.
    let trainedCount = 0, planned = 0;
    for(let day=1; day<=daysInMonth; day++){
      if(byDate.has(y + '-' + pad2(m+1) + '-' + pad2(day))) trainedCount++;
      if(schedFor(new Date(y, m, day).getDay())) planned++;
    }

    cal.append(el('div', { class:'cal-head' },
      el('div', { class:'cal-title' }, MONTHS[m] + ' ' + y),
      el('div', { class:'cal-count num' },
        el('b', { class: trainedCount >= planned ? 'hit' : '' }, String(trainedCount)),
        el('span', {}, ' / ' + planned))
    ));

    cal.append(el('div', { class:'cal-dow' },
      ['M','T','W','T','F','S','S'].map(d => el('span', {}, d))));

    const grid = el('div', { class:'cal-grid' });
    // Monday-first offset for the 1st of the month.
    const lead = (new Date(y, m, 1).getDay() + 6) % 7;
    for(let i=0;i<lead;i++) grid.append(el('div', { class:'blank' }));

    for(let day=1; day<=daysInMonth; day++){
      const key = y + '-' + pad2(m+1) + '-' + pad2(day);
      const s = byDate.get(key);
      const isFuture = key > todayKey;
      const cls = [
        s ? routineClass(s.routineId) : '',
        key === todayKey ? 'now' : '',
        isFuture ? 'fut' : ''
      ].filter(Boolean).join(' ');

      if(s){
        grid.append(el('button', { class:cls, title:key,
          onclick:()=>openSession(s.id) }, String(day)));
      } else {
        grid.append(el('div', { class:cls, title:key }, String(day)));
      }
    }
    cal.append(grid);
    wrap.append(cal);
  });

  wrap.append(el('div', { class:'cal-key' },
    el('span', {}, el('b',{style:'background:var(--amp)'}), S.routines[0] ? S.routines[0].name : 'A'),
    el('span', {}, el('b',{style:'background:rgba(255,159,28,.42)'}), S.routines[1] ? S.routines[1].name : 'B'),
    el('span', {}, el('b',{style:'background:var(--rack);border:1px solid var(--hair)'}), 'Rest')
  ));
  return wrap;
}

// Total reps per session, so rep progress is visible next to weight progress —
// on a plateau the weight line goes flat while this keeps climbing.
function seriesReps(name){
  const out = [];
  [...S.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s => {
    const e = s.entries.find(x => x.exerciseName === name);
    if(!e || !e.sets.length) return;
    out.push({ date:s.date, reps:e.sets.reduce((t,x)=>t+(x.reps||0),0), sets:e.sets.length });
  });
  return out;
}

// Bars beneath the weight chart, on the same x geometry so they line up.
function repsChart(d){
  if(!d.length) return null;
  const W = 320, H = 70, L = 34, R = 10, T = 16, B = 16;
  const iw = W - L - R, ih = H - T - B;
  const hi = Math.max(...d.map(p => p.reps), 1);
  const x = i => d.length === 1 ? L + iw/2 : L + (i/(d.length-1))*iw;
  const bw = Math.max(2.5, Math.min(13, (iw / Math.max(1, d.length)) * 0.62));

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('class','chart reps');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const mk = (t,a) => { const n = document.createElementNS(ns,t); for(const k in a) n.setAttribute(k,a[k]); return n; };

  svg.append(mk('line',{ class:'grid', x1:L, y1:T+ih, x2:W-R, y2:T+ih }));
  const lbl = mk('text',{ class:'lbl', x:L-6, y:T+6, 'text-anchor':'end' });
  lbl.textContent = hi; svg.append(lbl);
  const cap = mk('text',{ class:'lbl', x:L-6, y:T+ih+3.5, 'text-anchor':'end' });
  cap.textContent = '0'; svg.append(cap);

  d.forEach((p,i) => {
    const h = Math.max(1.5, (p.reps/hi) * ih);
    svg.append(mk('rect',{ class:'bar' + (i === d.length-1 ? ' last' : ''),
      x: x(i) - bw/2, y: T + ih - h, width: bw, height: h, rx: Math.min(2.5, bw/2) }));
  });

  const t = mk('text',{ class:'val', x:W-R, y:T-4, 'text-anchor':'end' });
  t.textContent = d[d.length-1].reps + ' reps'; svg.append(t);
  return svg;
}

function series(name, metric){
  const out = [];
  [...S.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s => {
    const e = s.entries.find(x => x.exerciseName === name);
    if(!e || !e.sets.length) return;
    const v = metric === 'top'
      ? Math.max(...e.sets.map(x => x.weight||0))
      : Math.max(...e.sets.map(e1rm));
    out.push({ date:s.date, value:v });
  });
  return out;
}

/* ---- CHARTS ----
   Hand-rolled SVG. Degenerate cases are the whole game: zero points must invite
   a first entry, one point must draw the dot and no line. */

function chartFor(data){
  if(!data.length){
    return el('div',{class:'empty'},
      el('span',{class:'big'},'No data yet'),
      'Log this exercise and the line starts here.');
  }
  const W = 320, H = 170, L = 34, R = 10, T = 16, B = 22;
  const iw = W - L - R, ih = H - T - B;

  let lo = Math.min(...data.map(p=>p.value));
  let hi = Math.max(...data.map(p=>p.value));
  if(hi === lo){ hi = lo + Math.max(1, lo*0.05); lo = Math.max(0, lo - Math.max(1, lo*0.05)); }
  const padY = (hi-lo)*0.12; hi += padY; lo = Math.max(0, lo - padY);

  const x = i => data.length === 1 ? L + iw/2 : L + (i/(data.length-1))*iw;
  const y = v => T + ih - ((v-lo)/(hi-lo))*ih;

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('class','chart');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const mk = (t, a) => { const n = document.createElementNS(ns,t); for(const k in a) n.setAttribute(k,a[k]); return n; };

  const defs = mk('defs',{});
  const grad = mk('linearGradient',{ id:'g', x1:'0', y1:'0', x2:'0', y2:'1' });
  grad.append(mk('stop',{ offset:'0', 'stop-color':'#FF9F1C', 'stop-opacity':'.22' }));
  grad.append(mk('stop',{ offset:'1', 'stop-color':'#FF9F1C', 'stop-opacity':'0' }));
  defs.append(grad); svg.append(defs);

  // Two reference lines only — top and bottom. No gridline clutter.
  [lo, hi].forEach(v => {
    svg.append(mk('line',{ class:'grid', x1:L, y1:y(v), x2:W-R, y2:y(v) }));
    const t = mk('text',{ class:'lbl', x:L-6, y:y(v)+3.5, 'text-anchor':'end' });
    t.textContent = nice(v); svg.append(t);
  });

  if(data.length > 1){
    const line = data.map((p,i)=>(i?'L':'M') + x(i).toFixed(1) + ' ' + y(p.value).toFixed(1)).join(' ');
    svg.append(mk('path',{ class:'area',
      d: line + ' L ' + x(data.length-1).toFixed(1) + ' ' + (T+ih) + ' L ' + x(0).toFixed(1) + ' ' + (T+ih) + ' Z' }));
    svg.append(mk('path',{ class:'line', d:line }));
  }

  // With many points, dots become noise — thin them out.
  const showDot = data.length <= 24 ? 1 : Math.ceil(data.length/24);
  data.forEach((p,i) => {
    const isLast = i === data.length-1;
    if(!isLast && i % showDot) return;
    svg.append(mk('circle',{ class:'dot' + (isLast?' last':''), cx:x(i), cy:y(p.value),
      r: isLast ? 4.5 : (data.length > 30 ? 2 : 3) }));
  });

  const lastP = data[data.length-1];
  const vt = mk('text',{ class:'val', x:Math.min(x(data.length-1), W-R-4), y:Math.max(T-3, y(lastP.value)-9),
    'text-anchor': data.length === 1 ? 'middle' : 'end' });
  vt.textContent = nice(lastP.value); svg.append(vt);

  const label = (i, anchor) => {
    const d = parseDate(data[i].date);
    const t = mk('text',{ class:'lbl', x:x(i), y:H-6, 'text-anchor':anchor });
    t.textContent = d.getDate() + ' ' + MON3[d.getMonth()];
    svg.append(t);
  };
  if(data.length === 1) label(0,'middle');
  else { label(0,'start'); label(data.length-1,'end'); }

  return svg;
}

function sparkline(pts){
  if(!pts || pts.length < 2) return null;
  const W = 320, H = 52;
  const vals = pts.map(p=>p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(hi === lo){ hi = lo+1; lo = lo-1; }
  const t0 = pts[0][0], t1 = pts[pts.length-1][0] || 1;
  const x = t => t1 === t0 ? 0 : (t-t0)/(t1-t0)*W;
  const y = v => H - 4 - ((v-lo)/(hi-lo))*(H-10);
  const d = pts.map((p,i)=>(i?'L':'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('class','spark');
  svg.setAttribute('preserveAspectRatio','none');
  const f = document.createElementNS(ns,'path');
  f.setAttribute('class','fill');
  f.setAttribute('d', d + ' L ' + W + ' ' + H + ' L 0 ' + H + ' Z');
  const l = document.createElementNS(ns,'path');
  l.setAttribute('d', d);
  svg.append(f, l);
  return svg;
}

    el('div',{class:'stat'}, el('span',{class:'micro'},'Volume'),
      el('div',{class:'v num'}, nice(volume(s)), el('span',{class:'u'}, unit()))),
    el('div',{class:'stat'}, el('span',{class:'micro'},'Time'),
      el('div',{class:'v num'}, s.startedAt && s.endedAt ? dur(s.endedAt-s.startedAt) : '—'))
  ));

  if(s.hr) body.append(hrPanel(s));

  s.entries.filter(e=>e.sets.length).forEach(e => {

/* ---- HEALTH ----
   Web apps cannot read HealthKit. Nothing can change that. What CAN happen is
   iOS Shortcuts reading Apple Health and handing the numbers over — either by
   opening this app with them in the URL hash, or by pasting them in. Since
   Google Health now writes Fitbit data back into Apple Health, that covers the
   Fitbit Air too. See the README for the shortcut, step by step. */

const ZONES = [
  { n:'Z1', lo:0.00, hi:0.60, c:'#8B95A3' },
  { n:'Z2', lo:0.60, hi:0.70, c:'#38BDF8' },
  { n:'Z3', lo:0.70, hi:0.80, c:'#5BD9A8' },
  { n:'Z4', lo:0.80, hi:0.90, c:'#FF9F1C' },
  { n:'Z5', lo:0.90, hi:9.99, c:'#FF6B6B' }
];

// Accepts "093105-72,093120-75" (HHMMSS-bpm) or a plain "72,75,80" list,
// with or without whitespace, brackets or a trailing comma.
function parseHr(text, dateKey){
  const base = parseDate(dateKey || localDate()).getTime();
  const parts = String(text).replace(/[\[\]"']/g,' ').split(/[,\s;]+/).filter(Boolean);
  const stamped = [], bare = [];
  for(const p of parts){
    let m = p.match(/^(\d{2})(\d{2})(\d{2})[-:](\d+(?:\.\d+)?)$/);
    if(m){
      const t = base + (+m[1]*3600 + +m[2]*60 + +m[3])*1000;
      const bpm = Math.round(+m[4]);
      if(bpm > 20 && bpm < 260) stamped.push([t, bpm]);
      continue;
    }
    m = p.match(/^(\d{1,3})(?:\.\d+)?$/);
    if(m){ const bpm = Math.round(+m[1]); if(bpm > 20 && bpm < 260) bare.push(bpm); }
  }
  if(stamped.length){ stamped.sort((a,b)=>a[0]-b[0]); return { stamped, bare:[] }; }
  return { stamped:[], bare };
}

function attachHr(dateKey, text, kcal){
  const s = sessionOn(dateKey);
  if(!s){ toast('No session on ' + dateKey); return false; }
  const { stamped, bare } = parseHr(text, dateKey);
  let pts = [];

  if(stamped.length){
    // Trim to the session window when we know it, with 3 minutes of slack.
    const a = (s.startedAt || stamped[0][0]) - 180000;
    const b = (s.endedAt || stamped[stamped.length-1][0]) + 180000;
    const win = stamped.filter(p => p[0] >= a && p[0] <= b);
    const use = win.length ? win : stamped;
    const t0 = use[0][0];
    pts = use.map(p => [Math.round((p[0]-t0)/1000), p[1]]);
  } else if(bare.length){
    const span = (s.startedAt && s.endedAt) ? (s.endedAt - s.startedAt)/1000 : bare.length*5;
    pts = bare.map((v,i) => [Math.round(i/Math.max(1,bare.length-1)*span), v]);
  } else {
    toast('No heart rate numbers found in that');
    return false;
  }

  // Downsample so a year of sessions stays well inside the localStorage budget.
  const MAX = 180;
  if(pts.length > MAX){
    const step = pts.length / MAX;
    const thin = [];
    for(let i=0;i<MAX;i++) thin.push(pts[Math.min(pts.length-1, Math.floor(i*step))]);
    thin.push(pts[pts.length-1]);
    pts = thin;
  }

  const vals = pts.map(p=>p[1]);
  s.hr = {
    avg: Math.round(vals.reduce((a,b)=>a+b,0)/vals.length),
    max: Math.max(...vals),
    min: Math.min(...vals),
    kcal: kcal ? Math.round(+kcal) || null : (s.hr && s.hr.kcal) || null,
    pts
  };
  save();
  return true;
}

function hrPanel(s){
  const hr = s.hr, mx = S.settings.maxHr || 190;
  const wrap = el('div', { class:'sec' },
    el('div', { class:'sec-head' },
      el('span',{class:'micro'},'Heart rate'),
      el('span',{class:'micro'}, hr.pts.length + ' samples')));

  wrap.append(el('div', { class:'tiles' },
    el('div',{class:'tile hr'}, el('span',{class:'micro'},'Average'),
      el('div',{class:'v num'}, String(hr.avg), el('span',{class:'u'},'bpm'))),
    el('div',{class:'tile hr'}, el('span',{class:'micro'},'Peak'),
      el('div',{class:'v num'}, String(hr.max), el('span',{class:'u'},'bpm'))),
    hr.kcal ? el('div',{class:'tile'}, el('span',{class:'micro'},'Energy'),
      el('div',{class:'v num'}, String(hr.kcal), el('span',{class:'u'},'kcal'))) : null,
    el('div',{class:'tile'}, el('span',{class:'micro'},'Low'),
      el('div',{class:'v num'}, String(hr.min), el('span',{class:'u'},'bpm')))
  ));

  const spark = sparkline(hr.pts);
  if(spark) wrap.append(spark);

  // Time in zone, from consecutive-sample gaps.
  const secs = ZONES.map(()=>0);
  for(let i=1;i<hr.pts.length;i++){
    const gap = Math.max(0, Math.min(120, hr.pts[i][0] - hr.pts[i-1][0]));
    const pct = hr.pts[i][1] / mx;
    const zi = ZONES.findIndex(z => pct >= z.lo && pct < z.hi);
    if(zi >= 0) secs[zi] += gap;
  }
  const tot = secs.reduce((a,b)=>a+b,0);
  if(tot > 0){
    const z = el('div', { class:'zones' });
    ZONES.forEach((zone, i) => {
      const p = secs[i]/tot*100;
      z.append(el('div', { class:'zone' },
        el('span',{class:'zn'}, zone.n),
        el('span',{class:'zbar'}, el('i',{ style:'width:'+p.toFixed(1)+'%;background:'+zone.c })),
        el('span',{class:'zv'}, secs[i] >= 60 ? Math.round(secs[i]/60)+'m' : Math.round(secs[i])+'s')
      ));
    });
    wrap.append(z);
    wrap.append(el('div',{class:'micro',style:'margin-top:8px'}, 'Zones from a max of ' + mx + ' bpm — change it in Settings'));
  }
  return wrap;
}

// #hr=…&kcal=… handed over by the shortcut.
function consumeHashImport(){
  const h = location.hash || '';
  if(h.indexOf('hr=') < 0) return;
  const q = new URLSearchParams(h.replace(/^#/, ''));
  const raw = q.get('hr'); if(!raw) return;
  history.replaceState(null, '', location.pathname + location.search);

  // Prefer today; otherwise the most recent session within 18 hours.
  let key = localDate();
  if(!sessionOn(key)){
    const recent = [...S.sessions].sort((a,b)=>b.date.localeCompare(a.date))
      .find(s => s.endedAt && Date.now() - s.endedAt < 18*3600*1000);
    if(recent) key = recent.date;
  }
  if(!sessionOn(key)){ toast('Heart rate received, but no session to attach it to'); return; }
  if(attachHr(key, raw, q.get('kcal'))){
    renderAll(); toast('Heart rate imported'); haptic(30);
    setTimeout(()=>openSession(sessionOn(key).id), 400);
  }
}

/* ---- BACKUP ---- */

function exportPayload(){ return JSON.stringify(S, null, 2); }
function exportName(){ return 'gym-backup-' + localDate() + '.json'; }

function widgetPayload(){
  const now = new Date();
  const dow = now.getDay();
  const r = routine(schedFor(dow));
  let next = null;
  for(let i=1;i<=7;i++){
    const d = (dow+i)%7;
    const id = schedFor(d);
    if(id){ next = { day: DAYS[d], routine: (routine(id)||{}).name || '' }; break; }
  }
  const done = [...S.sessions].filter(s=>setCount(s)>0).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return JSON.stringify({
    generated: new Date().toISOString(),
    today: r ? r.name : 'Rest',
    todaySubtitle: r ? r.subtitle : '',
    isRestDay: !r,
    next,
    last: done ? {
      date: done.date,
      routine: (routine(done.routineId)||{}).name || '',
      sets: setCount(done),
      volume: Math.round(volume(done)),
      unit: unit(),
      avgHr: done.hr ? done.hr.avg : null
    } : null,
    weekCount: [...S.sessions].filter(s => setCount(s)>0 &&
      (Date.now() - parseDate(s.date).getTime()) < 7*864e5).length
  }, null, 2);
}

async function shareFile(name, text, mime='application/json'){
  const file = new File([text], name, { type:mime });
  // Share sheet first: on iOS this is the only route that reliably reaches
  // Files / iCloud Drive from a standalone PWA.
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title:name }); return true; }
    catch(e){ if(e && e.name === 'AbortError') return true; }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type:mime }));
    const a = el('a', { href:url, download:name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return true;
  } catch(e){ return false; }
}

async function doExport(){
  const ok = await shareFile(exportName(), exportPayload());
  if(ok){
    S.settings.backupAt = S.sessions.length; save();
    toast('Backup created');
  } else {
    openSheet({ title:'Copy your backup', body:[
      el('div',{class:'note'},'Saving the file did not work here. Select all of this and keep it somewhere safe.'),
      el('textarea',{ class:'inp', rows:'12', style:'margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:11px', text: exportPayload() })
    ]});
  }
}

function doImport(){
  const file = el('input', { type:'file', accept:'application/json,.json', style:'display:none' });
  file.addEventListener('change', () => {
    const f = file.files && file.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let parsed;
      try { parsed = JSON.parse(String(rd.result)); }
      catch(e){ toast('That file is not valid JSON'); return; }
      if(!parsed || !Array.isArray(parsed.sessions) || !Array.isArray(parsed.routines)){
        toast('That does not look like a gym backup'); return;
      }
      const n = parsed.sessions.length;
      confirmSheet('Replace everything?',
        'This backup holds ' + n + ' session' + (n===1?'':'s') + '. Your current data (' +
        S.sessions.length + ') will be overwritten.', () => {
          S = migrate(parsed); save(); closeSheet(); renderAll();
          toast('Restored ' + n + ' sessions');
        });
    };
    rd.readAsText(f);
  });
  document.body.append(file); file.click();
  setTimeout(()=>file.remove(), 60000);
}

function maybeBackupNag(){
  const since = S.sessions.length - (S.settings.backupAt || 0);

/* ---- VIEWPORT DIAGNOSTICS ----
   Five rounds of trimming the tab bar without the gap moving points at the
   layout viewport being shorter than the screen, not at the CSS. If it is, the
   app is laid out inside a box that stops above the bottom of the display and
   no amount of padding can reach down there. iOS snapshots viewport settings
   when a site is added to the home screen, so an install predating
   viewport-fit=cover keeps the short box until it is re-added. */

function viewportShortfall(){
  const scr = Math.round(screen.height || 0);
  const win = Math.round(window.innerHeight || 0);
  if(!scr || !win) return 0;
  // Portrait only — in landscape screen.height is the short edge.
  if(win > scr) return 0;
  return scr - win;
}

function viewportLine(){
  const t = $('.tabs');
  const gap = t ? Math.round(window.innerHeight - t.getBoundingClientRect().bottom) : -1;
  const vv = window.visualViewport ? Math.round(window.visualViewport.height) : 0;
  const app = $('#app') ? Math.round($('#app').getBoundingClientRect().height) : 0;
  return 'win ' + Math.round(window.innerHeight) + ' · vv ' + vv +
         ' · screen ' + Math.round(screen.height || 0) +
         ' · app ' + app + ' · gap ' + gap + 'px';
}

function shortViewportWarning(){
  const short = viewportShortfall();
  if(short <= 8) return null;
  return el('div', { class:'warn', style:'margin-top:12px;text-align:left' },
    el('b', {}, 'This install is not using the full screen. '),
    'The page is ' + Math.round(window.innerHeight || 0) + 'px tall but the display is ' +
    Math.round(screen.height || 0) + 'px — a ' + short + 'px strip at the bottom is outside the app, ' +
    'which is why the bar looks padded no matter what the padding is set to. ',
    el('b', {}, 'Fix: '), 'delete the home screen icon, open the site in Safari, and Add to Home Screen again. ' +
    'iOS records the display settings when the icon is created and will not update them otherwise. ' +
    'Your data is kept — it lives with the website, not the icon.');
}

/* ---- SHEETS ---- */

/* ---- SHEET DRAG-TO-DISMISS ----
   Drag the grip or the title bar down and the sheet follows the finger; past a
   third of its height, or on a quick flick, it closes. Anything less springs
   back. The scrim fades with the drag so the gesture reads as reversible. */
function enableSheetDrag(sheet, scrim, onClose){
  const handles = [sheet.querySelector('.grab'), sheet.querySelector('.sheet-head')].filter(Boolean);
  let st = null;

  const move = e => {
    if(!st) return;
    const dy = e.clientY - st.y;
    if(dy < 0){ sheet.style.transform = 'translateY(' + (dy / 4) + 'px)'; return; }  // slight resistance upward
    st.dy = dy;
    sheet.style.transform = 'translateY(' + dy + 'px)';
    if(scrim) scrim.style.opacity = String(Math.max(0.15, 1 - dy / (st.h || 400)));
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if(!st) return;
    const dy = st.dy || 0;
    const ms = Math.max(1, Date.now() - st.t);
    const flick = dy / ms > 0.5;              // px per ms
    const far = dy > Math.min(140, (st.h || 400) * 0.33);
    st = null;
    if(far || (flick && dy > 40)){
      sheet.style.transition = 'transform .18s ease-out';
      sheet.style.transform = 'translateY(100%)';
      if(scrim){ scrim.style.transition = 'opacity .18s'; scrim.style.opacity = '0'; }
      haptic(14);
      setTimeout(onClose, 170);
    } else {
      sheet.style.transition = 'transform .2s cubic-bezier(.2,.9,.3,1)';
      sheet.style.transform = '';
      if(scrim){ scrim.style.transition = 'opacity .2s'; scrim.style.opacity = ''; }
      setTimeout(() => { sheet.style.transition = ''; if(scrim) scrim.style.transition = ''; }, 220);
    }
  };
  const down = e => {
    if(e.button !== undefined && e.button !== 0) return;
    if(e.target.closest('.x')) return;                 // let the close button be a button
    st = { y: e.clientY, t: Date.now(), dy: 0, h: sheet.getBoundingClientRect().height };
    sheet.style.transition = 'none';
    sheet.style.animation = 'none';                    // don't fight the open animation
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    e.preventDefault();
  };

  handles.forEach(h => h.addEventListener('pointerdown', down));
}

let sheetOpen = false;
function openSheet({ title, body, footer, action }){
  closeSheet();
  const scrim = el('div',{ class:'scrim', onclick:closeSheet });
  const bodyEl = el('div',{ class:'sheet-body' }, body || []);
  const kids = [
    el('div',{class:'grab','aria-label':'Drag down to close'}, el('span',{class:'grip'})),
    el('div',{class:'sheet-head'}, el('h2',{},title||''),
      el('button',{class:'x','aria-label':'close',onclick:closeSheet},'✕')),
    bodyEl
  ];
  if(footer) kids.push(el('div',{class:'sheet-foot'}, footer));
  else if(action) kids.push(el('div',{class:'sheet-foot'},
    el('button',{ class:'btn huge' + (action.primary?' primary':''), onclick:()=>action.run() }, action.label)));
  else kids.push(el('div',{class:'sheet-foot'}, el('div',{style:'height:4px'})));

  const sheet = el('div',{ class:'sheet', role:'dialog', 'aria-modal':'true' }, kids);
  document.body.append(scrim, sheet);
  sheetOpen = true;
  const m = $('main'); if(m) m.style.overflowY = 'hidden';   // don't scroll behind the sheet
  enableSheetDrag(sheet, scrim, closeSheet);
}
function closeSheet(){
  $$('.scrim,.sheet').forEach(n=>n.remove());
  sheetOpen = false;
  const m = $('main'); if(m) m.style.overflowY = 'auto';
}
function confirmSheet(title, msg, onYes){
  const prev = $('.sheet');
  const scrim = el('div',{ class:'scrim', style:'z-index:70' });
  const bail = () => { scrim.remove(); sheet.remove(); };
  const sheet = el('div',{ class:'sheet', style:'z-index:71' },
    el('div',{class:'grab','aria-label':'Drag down to cancel'}, el('span',{class:'grip'})),
    el('div',{class:'sheet-head'}, el('h2',{},title)),
    el('div',{class:'sheet-body'}, el('div',{class:'note'}, msg)),
    el('div',{class:'sheet-foot'},
      el('button',{class:'btn danger huge',onclick:()=>{ bail(); onYes(); }},'Yes, do it'),
      el('button',{class:'btn ghost',style:'margin-top:8px',onclick:bail},'Cancel'))
  );
  scrim.addEventListener('click', bail);
  document.body.append(scrim, sheet);
  enableSheetDrag(sheet, scrim, bail);
  if(!prev) sheetOpen = true;
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && sheetOpen) closeSheet(); });

/* ---- ROUTER ---- */

const SCREENS = { today:renderToday, exercises:renderExercises, history:renderHistory,
                  timer:renderTimer, settings:renderSettings };
let screen = 'today';

function go(name){
  screen = name;
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.go === name));
  $$('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + name));
  SCREENS[name]();
  scrollTop();
  audio();
}
$$('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.go)));

function renderAll(){ SCREENS[screen](); }

/* ---- KEYBOARD-AWARE SHEETS ----
   Without this the ADD SET button hides behind the iOS number pad. */
if(window.visualViewport){
  const vv = window.visualViewport;
  const upd = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', kb + 'px');
    $$('.sheet').forEach(s => s.classList.toggle('kb', kb > 60));
  };
  vv.addEventListener('resize', upd);
  vv.addEventListener('scroll', upd);
}

/* ---- BOOT ---- */

// Bump alongside CACHE in sw.js. Shown in Settings so it is possible to tell at
// a glance whether the phone is running the latest build or a cached one.
const APP_VERSION = 'build 13';
let swUpdate = false;

S = load();
restLoad();
go('today');
consumeHashImport();
window.addEventListener('hashchange', consumeHashImport);

setInterval(() => {
  paintRest();
  if(box.running) paintBox();
  // Keep the session clock running while it is on screen.
  if(screen === 'today' && !sheetOpen && dayView === localDate()){
    const s = sessionOn(localDate());
    if(s && s.startedAt && !sessionFinished(s)){
      const st = $('#s-today .stats .stat:last-child .v');
      if(st) st.textContent = dur(sessionElapsed(s));
    }
  }
}, 250);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if(!w) return;
        w.addEventListener('statechange', () => {
          if(w.state === 'installed' && navigator.serviceWorker.controller){
            swUpdate = true;
            if(screen === 'today') renderToday();
          }
        });
      });
    }).catch(()=>{});
  });
}
