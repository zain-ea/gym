<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Gym</title>
<meta name="theme-color" content="#0F1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* ==========================================================================
   PALETTE — chalk on iron, under a worklight.
   Six values. A cold charcoal ground rather than pure black (black loses its
   edges and shows every fingerprint under gym fluorescents), chalk white for
   numerals so they hold up at arm's length mid-set, and exactly one signal
   colour — safety amber, the colour gyms and warehouses already use for
   "mind this" — reserved for whatever is happening NOW. Cool blue appears
   only to mean rest, so work vs rest is readable with the sound off.
   ========================================================================== */
:root{
  --pit:#0F1216;      /* ground            */
  --rack:#171B21;     /* raised surfaces   */
  --chalk:#EEF1F5;    /* primary text      */
  --steel:#8B95A3;    /* secondary text    */
  --amp:#FF9F1C;      /* active / work     */
  --cool:#38BDF8;     /* rest              */

  --hair:rgba(255,255,255,.07);
  --hair2:rgba(255,255,255,.12);
  --sink:rgba(0,0,0,.35);

  --sat:env(safe-area-inset-top, 0px);
  --sab:env(safe-area-inset-bottom, 0px);
  --sal:env(safe-area-inset-left, 0px);
  --sar:env(safe-area-inset-right, 0px);

  --pad:16px;
  /* Tab bar sits tight to the bottom. 46px of tab (still over the 44px tap
     minimum) plus a flat 10px below the labels — no safe-area maths, because
     nested max()/calc()/env() inside a custom property is exactly the sort of
     thing that silently resolves to something unexpected on one browser. 10px
     rather than 0 because iOS paints the home indicator in that strip and at 0
     the white bar cuts through the words. */
  --tabh:44px;
  --tabbot:0px;
  --barh:52px;
  --r:14px;

  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* App shell: the document itself never scrolls — only <main> does. That is what
   stops iOS Safari collapsing its bottom bar mid-scroll and dragging a fixed tab
   bar up with it, and it kills the rubber-band behind the app. */
html,body{height:100%;overflow:hidden}
html{background:var(--pit);-webkit-text-size-adjust:100%}
body{
  position:fixed;inset:0;width:100%;
  font-family:var(--sys);
  font-size:15px;
  line-height:1.4;
  color:var(--chalk);
  background:var(--pit);
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;   /* no double-tap zoom */
}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
ul{list-style:none}
:focus-visible{outline:2px solid var(--amp);outline-offset:2px;border-radius:6px}

/* ---- TYPE ---- */
.micro{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--steel)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
.n-sm{font-size:19px;font-weight:700}
.n-md{font-size:28px;font-weight:750;letter-spacing:-.02em}
.n-lg{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.title{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.02}
.sub{color:var(--steel);font-size:14px}
.dim{color:var(--steel)}
.amp{color:var(--amp)}
.cool{color:var(--cool)}

/* ---- APP FRAME ---- */
/* height:100% of <body>, which is position:fixed inset:0 and therefore exactly
   the viewport. Deliberately NOT 100dvh — dvh and the fixed-body box can differ
   on iOS, and when dvh comes out short the whole shell sits above the bottom of
   the screen, which looks exactly like padding under the tab bar. */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}

.topbar{
  flex:none;z-index:40;
  padding:var(--sat) calc(var(--pad) + var(--sar)) 0 calc(var(--pad) + var(--sal));
  background:rgba(15,18,22,.82);
  backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid var(--hair);
}
.rest{
  height:var(--barh);display:flex;align-items:center;gap:10px;width:100%;
  text-align:left;
}
.rest-dot{width:9px;height:9px;border-radius:50%;background:var(--steel);flex:none;transition:background .2s}
.rest.on .rest-dot{background:var(--cool);box-shadow:0 0 0 4px rgba(56,189,248,.16)}
.rest-time{font-size:22px;font-weight:750;min-width:76px}
.rest.on .rest-time{color:var(--cool)}
.rest-label{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rest-presets{display:flex;gap:6px;flex:none}
.preset{
  padding:7px 11px;border-radius:9px;background:var(--rack);border:1px solid var(--hair);
  font-size:12px;font-weight:650;color:var(--steel);font-variant-numeric:tabular-nums;
}
.preset:active{background:#1E242C}

main{
  flex:1;
  min-height:0;                        /* lets it actually shrink and scroll */
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:12px calc(var(--pad) + var(--sar)) 20px calc(var(--pad) + var(--sal));
}
.screen{display:none;animation:fade .18s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.tabs{
  flex:none;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:0 var(--sar) var(--tabbot) var(--sal);
  background:rgba(15,18,22,.86);
  backdrop-filter:saturate(140%) blur(14px);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  border-top:1px solid var(--hair);
}
.tab{
  height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;
  color:var(--steel);font-size:9.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;
  line-height:1;   /* kills the leading under the label, which reads as padding */
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--chalk)}
.tab.on svg{color:var(--amp)}

/* ---- BLOCKS ---- */
.card{background:var(--rack);border:1px solid var(--hair);border-radius:var(--r);padding:14px}
.card + .card{margin-top:10px}
.sec{margin-top:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}

.stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin-top:14px}
.stat{padding:11px 12px;background:var(--rack);border:1px solid var(--hair)}
.stat:first-child{border-radius:var(--r) 0 0 var(--r)}
.stat:last-child{border-radius:0 var(--r) var(--r) 0}
.stat:only-child{border-radius:var(--r)}
.stat .micro{display:block;margin-bottom:5px}
.stat .v{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .u{font-size:12px;font-weight:600;color:var(--steel);margin-left:2px}

.seg{display:flex;gap:2px;background:var(--rack);border:1px solid var(--hair);border-radius:11px;padding:3px}
.seg button{
  flex:1;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:650;color:var(--steel);
  white-space:nowrap;
}
.seg button.on{background:#252C36;color:var(--chalk)}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:var(--rack);border:1px solid var(--hair);font-size:12px;font-weight:600;color:var(--steel);
}
.chip.on{background:rgba(255,159,28,.14);border-color:rgba(255,159,28,.4);color:var(--amp)}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;padding:14px;border-radius:12px;
  background:var(--rack);border:1px solid var(--hair2);
  font-size:15px;font-weight:650;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--amp);border-color:var(--amp);color:#140D02;font-weight:750}
.btn.huge{min-height:64px;font-size:17px;font-weight:800;letter-spacing:.02em}
.btn.ghost{background:none;color:var(--steel)}
.btn.danger{color:#FF6B6B;border-color:rgba(255,107,107,.28)}
.btn.sm{min-height:40px;padding:9px 14px;width:auto;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row-btns{display:flex;gap:8px}
.row-btns .btn{flex:1}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair)}
.field:last-child{border-bottom:0}
.field label{flex:1;min-width:0}
.field .hint{display:block;font-size:12px;color:var(--steel);margin-top:2px}
.inp{
  background:#0D1014;border:1px solid var(--hair2);border-radius:10px;padding:11px 12px;
  font-size:16px;width:100%;
}
.inp.tight{width:auto;min-width:96px;text-align:right;font-variant-numeric:tabular-nums}

/* ---- TODAY ---- */
.today-head{padding-top:4px}
.exs{margin-top:18px;display:flex;flex-direction:column;gap:2px}
.ex{
  display:flex;flex-direction:column;width:100%;text-align:left;
  background:var(--rack);border:1px solid var(--hair);padding:13px 14px;
}
.ex-top{display:flex;align-items:stretch;gap:12px}
.ex:first-child{border-radius:var(--r) var(--r) 0 0}
.ex:last-child{border-radius:0 0 var(--r) var(--r)}
.ex:only-child{border-radius:var(--r)}
.ex:active{background:#1C222A}
.ex-mark{width:3px;border-radius:2px;background:var(--hair2);flex:none;transition:background .2s}
.ex.done .ex-mark{background:var(--amp)}
.ex-body{flex:1;min-width:0}
.ex-name{font-size:16px;font-weight:650;letter-spacing:-.01em}
.ex.done .ex-name{color:var(--chalk)}
.ex-line{margin-top:5px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--steel);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-line b{font-weight:650;color:var(--chalk)}
.ex-line .tag{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--steel);margin-right:6px}
.ex-line.today .tag{color:var(--amp)}
.ex-line.goal{color:var(--cool)}
.ex-line.goal .tag{color:var(--cool)}
.ex-line.goal b{color:var(--cool);font-weight:700}
.ex-line.goal .up{color:var(--amp);font-weight:800}
.ex-count{
  flex:none;align-self:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--steel);min-width:22px;text-align:right;
}
.ex.done .ex-count{color:var(--amp)}
.ex-x{
  flex:none;align-self:center;width:32px;height:32px;border-radius:50%;
  color:var(--steel);font-size:19px;line-height:1;display:grid;place-items:center;margin-left:2px;
}
.ex-x:active{background:rgba(255,107,107,.16);color:#FF6B6B}

/* ---- QUICK SET ROW ----
   Four boxes under each card: swipe a number to change it, let go and it saves.
   No sheet, no Save button. Prefilled from the target, shown dimmed until they
   are committed so an untouched card never counts as done. */
.qrow{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:5px;margin-top:11px}
.qbox{
  background:#0D1014;border:1px solid var(--hair);border-radius:10px;
  padding:5px 2px 6px;text-align:center;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.qbox .k{display:block;font-size:8.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--steel);margin-bottom:1px}
.qbox .n{
  display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.15;color:var(--chalk);
}
/* Blue means "this is the target". Amber means "you have moved it off target".
   Per box, live, both ways — swipe back onto the target number and it turns
   blue again. */
.qbox.at-target .n{color:var(--cool)}
.qbox.at-target{border-color:rgba(56,189,248,.3)}
.qbox.changed .n{color:var(--amp)}
.qbox.changed{border-color:rgba(255,159,28,.34)}
.qbox.zero .n{color:var(--steel);opacity:.4}
.qbox.drag{border-color:var(--amp);background:rgba(255,159,28,.12)}
.qhint{margin-top:6px;font-size:11px;color:var(--steel);text-align:center}

.rest-day{text-align:center;padding:30px 16px}
.rest-day .big{font-size:26px;font-weight:800;letter-spacing:-.02em}

/* ---- WEEK ---- */
.week{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.wk{background:var(--rack);border:1px solid var(--hair);overflow:hidden;transition:border-color .15s,background .15s}
.wk:first-child{border-radius:var(--r) var(--r) 0 0}
.wk:last-child{border-radius:0 0 var(--r) var(--r)}
.wk.drop{border-color:var(--amp);background:rgba(255,159,28,.12)}
.wk.today{background:#1B212A}
.wk-head{display:flex;align-items:center;gap:10px;padding:11px 12px;width:100%;text-align:left}
.wk-d{width:34px;flex:none;font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--steel)}
.wk.today .wk-d{color:var(--amp)}
.wk-mid{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.wk-badge{font-size:11px;font-weight:700;color:var(--amp);font-variant-numeric:tabular-nums;flex:none}
.wk-chev{color:var(--steel);font-size:15px;flex:none;transition:transform .18s;width:14px;text-align:center}
.wk.open .wk-chev{transform:rotate(90deg)}

.pill{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;border-radius:999px;
  background:#272F3A;border:1px solid var(--hair2);font-size:13px;font-weight:650;
  max-width:100%;min-height:34px;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .grip{flex:none;width:9px;height:13px;opacity:.5}
.pill .grip i{display:block;width:3px;height:3px;border-radius:50%;background:currentColor;
  box-shadow:6px 0 currentColor,0 5px currentColor,6px 5px currentColor,0 10px currentColor,6px 10px currentColor}
.pill.rest{background:none;border-style:dashed;color:var(--steel);font-weight:500;padding-left:12px}
.pill.dragging{opacity:.25}
.pill.ghost{
  position:fixed;z-index:90;pointer-events:none;margin:0;
  box-shadow:0 14px 32px rgba(0,0,0,.6);transform:scale(1.07);
  border-color:var(--amp);
}

/* tick — "I did this workout", straight into history */
.tick{
  width:38px;height:38px;flex:none;border-radius:50%;
  background:none;border:1.5px solid var(--hair2);color:var(--steel);
  display:grid;place-items:center;font-size:16px;line-height:1;
}
.tick.on{background:var(--amp);border-color:var(--amp);color:#140D02;font-weight:800}
.tick:active{transform:scale(.9)}
.tick[disabled]{opacity:.25}

/* ---- BACK NAV ---- */
.back{
  display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;margin:0 0 12px -6px;
  border-radius:10px;color:var(--steel);font-size:14px;font-weight:600;width:auto;
}
.back:active{background:var(--rack)}
.back i{font-size:18px;line-height:1;font-style:normal}

/* ---- LIFT LIST ---- */
.lifts{display:flex;flex-direction:column;gap:2px}
.lift{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;
  background:var(--rack);border:1px solid var(--hair);
}
.lift:first-child{border-radius:var(--r) var(--r) 0 0}
.lift:last-child{border-radius:0 0 var(--r) var(--r)}
.lift:only-child{border-radius:var(--r)}
.lift:active{background:#1C222A}
.lift-mid{flex:1;min-width:0}
.lift-nm{font-size:15px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lift-meta{font-size:12px;color:var(--steel);font-variant-numeric:tabular-nums;margin-top:2px}
.lift-w{flex:none;text-align:right}
.lift-w .v{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums}
.lift-w .d{font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:1px}
.lift-w .d.up{color:var(--amp)}
.lift-w .d.flat{color:var(--steel)}

/* ---- DRAG-TO-SET BOXES ---- */
.wbox{
  background:var(--rack);border:1px solid var(--hair2);border-radius:var(--r);
  padding:12px 10px 10px;text-align:center;position:relative;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.wbox.drag{border-color:var(--amp);background:rgba(255,159,28,.09)}
.wbox .micro{display:block;margin-bottom:4px}
.wbox input{
  width:100%;text-align:center;background:none;border:0;padding:0;
  font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  pointer-events:none;
}
.wbox.typing input{pointer-events:auto}
.wbox .u{display:block;font-size:10px;font-weight:650;letter-spacing:.08em;
  text-transform:uppercase;color:var(--steel);margin-top:3px}
.wbox .arrows{position:absolute;top:8px;right:8px;color:var(--steel);opacity:.4;
  font-size:9px;line-height:1.05;text-align:center}
.wbox.off input{color:var(--steel);opacity:.45}
.sets3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.hint-drag{margin-top:10px;text-align:center;font-size:12px;color:var(--steel)}

/* ---- LOG SHEET ---- */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(4,6,8,.62);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:fade .16s ease;
}
.sheet{
  position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:61;
  max-height:calc(100% - var(--sat) - 24px);
  display:flex;flex-direction:column;
  background:#12161B;border:1px solid var(--hair2);border-bottom:0;
  border-radius:20px 20px 0 0;
  padding-bottom:16px;   /* clear of the home-indicator swipe, no dead strip */
  animation:up .22s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 -20px 60px rgba(0,0,0,.5);
}
.sheet.kb{padding-bottom:10px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
/* Generous grab zone — the visible grip is 4px tall, which is not a tap target */
.grab{
  flex:none;padding:10px 0 6px;display:flex;justify-content:center;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
}
.grip{width:38px;height:4px;border-radius:2px;background:var(--hair2);display:block}
.grab:active .grip{background:var(--steel)}
.sheet-head{
  display:flex;align-items:center;gap:12px;padding:10px calc(var(--pad) + var(--sar)) 12px calc(var(--pad) + var(--sal));
  border-bottom:1px solid var(--hair);flex:none;
}
.sheet-head h2{flex:1;min-width:0;font-size:19px;font-weight:750;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:36px;height:36px;border-radius:50%;background:var(--rack);display:grid;place-items:center;flex:none;
  font-size:19px;color:var(--steel);line-height:1}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px calc(var(--pad) + var(--sar)) 4px calc(var(--pad) + var(--sal))}
.sheet-foot{flex:none;padding:12px calc(var(--pad) + var(--sar)) 0 calc(var(--pad) + var(--sal))}

.ref{
  margin-top:12px;padding:11px 12px;border-radius:11px;background:rgba(255,255,255,.035);
  border:1px solid var(--hair);font-size:13px;font-variant-numeric:tabular-nums;color:var(--steel);
}
.ref b{color:var(--chalk);font-weight:650}
.ref.goal{background:rgba(56,189,248,.09);border-color:rgba(56,189,248,.28);color:var(--cool);font-size:15px;font-weight:650}
.ref.goal b{color:var(--cool);font-weight:750}
.ref.goal .up{color:var(--amp);font-weight:800;font-size:13px}
.ref.goal .why{margin-top:5px;font-size:12.5px;font-weight:400;color:var(--steel);line-height:1.45}

.sugg{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}

/* ---- TIMERS ---- */
.clock{
  text-align:center;padding:20px 0 10px;
  border-radius:20px;transition:background .3s ease;
}
.clock .phase{font-size:13px;font-weight:750;letter-spacing:.18em;text-transform:uppercase;color:var(--steel)}
.clock .big{
  font-size:clamp(78px,27vw,150px);font-weight:800;letter-spacing:-.045em;line-height:.94;
  font-variant-numeric:tabular-nums;margin:6px 0 2px;
}
.clock .round{font-size:14px;font-weight:650;color:var(--steel);font-variant-numeric:tabular-nums}
.clock.work{background:rgba(255,159,28,.1)}
.clock.work .phase,.clock.work .big{color:var(--amp)}
.clock.rest{background:rgba(56,189,248,.1)}
.clock.rest .phase,.clock.rest .big{color:var(--cool)}
.clock.prep .big{color:var(--chalk)}
.clock.done .big{color:var(--chalk)}
.track{display:flex;gap:3px;margin:16px 0 0}
.track i{flex:1;height:5px;border-radius:3px;background:var(--hair2)}
.track i.done{background:var(--steel)}
.track i.now{background:var(--amp)}

.warn{
  margin-top:14px;padding:11px 12px;border-radius:11px;
  background:rgba(255,159,28,.08);border:1px solid rgba(255,159,28,.22);
  font-size:12.5px;color:#E7C892;line-height:1.45;
}
.note{
  margin-top:10px;padding:11px 12px;border-radius:11px;background:rgba(255,255,255,.035);
  border:1px solid var(--hair);font-size:12.5px;color:var(--steel);line-height:1.5;
}
.note b{color:var(--chalk);font-weight:650}
.note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px;color:var(--chalk);
  word-break:break-all}
.steps{counter-reset:s;margin-top:10px}
.steps li{
  counter-increment:s;position:relative;padding:0 0 11px 30px;font-size:13px;color:var(--steel);line-height:1.5;
}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;
  background:var(--rack);border:1px solid var(--hair2);color:var(--chalk);
  font-size:11px;font-weight:700;display:grid;place-items:center;
}
.steps li b{color:var(--chalk);font-weight:650}

/* ---- SCHEDULE ---- */
.days{display:flex;flex-direction:column;gap:2px}
.day{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;
  background:var(--rack);border:1px solid var(--hair);
}
.day:first-child{border-radius:var(--r) var(--r) 0 0}
.day:last-child{border-radius:0 0 var(--r) var(--r)}
.day:active{background:#1C222A}
.day .d{width:42px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--steel)}
.day.today .d{color:var(--amp)}
.day .r{flex:1;font-size:15px;font-weight:650}
.day.off .r{color:var(--steel);font-weight:500}
.day .tick{width:8px;height:8px;border-radius:50%;background:var(--hair2)}
.day:not(.off) .tick{background:var(--amp)}

/* ---- HISTORY / CHARTS ---- */
.chart{width:100%;display:block;overflow:visible}
.chart .grid{stroke:var(--hair);stroke-width:1}
.chart .line{fill:none;stroke:var(--amp);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .area{fill:url(#g);stroke:none}
.chart .dot{fill:var(--pit);stroke:var(--amp);stroke-width:2}
.chart .dot.last{fill:var(--amp)}
.chart .lbl{fill:var(--steel);font-size:10px;font-weight:600;font-family:var(--sys);
  font-variant-numeric:tabular-nums}
.chart .val{fill:var(--chalk);font-size:11px;font-weight:750;font-family:var(--sys);
  font-variant-numeric:tabular-nums}
.chart .bar{fill:rgba(255,159,28,.34)}
.chart .bar.last{fill:var(--amp)}

.empty{text-align:center;padding:34px 16px;color:var(--steel);font-size:14px;line-height:1.5}
.empty .big{display:block;font-size:17px;font-weight:700;color:var(--chalk);margin-bottom:6px}

.sess{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;
  background:var(--rack);border:1px solid var(--hair);
}
.sess:first-child{border-radius:var(--r) var(--r) 0 0}
.sess:last-child{border-radius:0 0 var(--r) var(--r)}
.sess:only-child{border-radius:var(--r)}
.sess:active{background:#1C222A}
.sess .dt{width:52px;flex:none}
.sess .dt .dd{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1}
.sess .dt .mm{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--steel);margin-top:2px}
.sess .mid{flex:1;min-width:0}
.sess .nm{font-size:15px;font-weight:650}
.sess .meta{font-size:12px;color:var(--steel);font-variant-numeric:tabular-nums;margin-top:2px}
.hrb{display:inline-flex;align-items:center;gap:4px;color:#FF6B6B;font-weight:650}

/* ---- MONTH CALENDARS ---- */
.cal{margin-top:14px}
.cal + .cal{margin-top:22px}
.cal-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.cal-title{font-size:16px;font-weight:750;letter-spacing:-.01em}
.cal-count{flex:none;font-size:13px;color:var(--steel);font-weight:600}
.cal-count b{font-size:16px;font-weight:800;color:var(--chalk)}
.cal-count b.hit{color:var(--amp)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px}
.cal-dow span{text-align:center;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--steel)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid > *{
  aspect-ratio:1;border-radius:7px;display:grid;place-items:center;
  font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;
  background:var(--rack);border:1px solid var(--hair);color:var(--steel);
}
.cal-grid .blank{background:none;border-color:transparent}
.cal-grid .a{background:var(--amp);border-color:transparent;color:#140D02;font-weight:800}
.cal-grid .b{background:rgba(255,159,28,.42);border-color:transparent;color:var(--chalk);font-weight:800}
.cal-grid .x{background:var(--steel);border-color:transparent;color:var(--pit);font-weight:800}
.cal-grid .now{box-shadow:0 0 0 1.5px var(--chalk)}
.cal-grid .fut{opacity:.3}
.cal-grid button:active{transform:scale(.9)}
.cal-key{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:11px;color:var(--steel)}
.cal-key span{display:flex;align-items:center;gap:5px}
.cal-key b{width:9px;height:9px;border-radius:3px;display:block}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tile{border-radius:var(--r);padding:12px;border:1px solid var(--hair);background:var(--rack)}
.tile .micro{display:block;margin-bottom:6px}
.tile .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .v .u{font-size:12px;font-weight:650;color:var(--steel);margin-left:3px;letter-spacing:0}
.tile.hr{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.24)}
.tile.hr .v{color:#FF8A8A}

.zones{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.zone{display:flex;align-items:center;gap:9px;font-size:12px;font-variant-numeric:tabular-nums}
.zone .zn{width:20px;font-weight:700;color:var(--steel)}
.zone .zbar{flex:1;height:8px;border-radius:4px;background:var(--rack);overflow:hidden}
.zone .zbar i{display:block;height:100%;border-radius:4px}
.zone .zv{width:42px;text-align:right;color:var(--steel)}

.spark{width:100%;height:52px;display:block;margin-top:10px}
.spark path{fill:none;stroke:#FF6B6B;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .fill{fill:rgba(255,107,107,.14);stroke:none}

/* ---- MISC ---- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabh) + var(--tabbot) + 14px);z-index:80;
  background:#242B34;border:1px solid var(--hair2);border-radius:12px;

}
.banner{
  display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:12px;margin-bottom:14px;
  background:rgba(255,159,28,.1);border:1px solid rgba(255,159,28,.26);font-size:13px;line-height:1.45;
}
.banner.bad{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.26)}
.banner .t{flex:1}
.reorder{display:flex;gap:4px;flex:none}
.reorder button{width:34px;height:34px;border-radius:9px;background:#0D1014;border:1px solid var(--hair);
  color:var(--steel);font-size:13px;display:grid;place-items:center}
.reorder button:active{color:var(--chalk)}
.editrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair)}
.editrow .inp{flex:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

<script>
"use strict";
/* ==========================================================================
   GYM — a single-file training log.
   Sections: STATE · STORAGE · UTIL · AUDIO · WAKE LOCK · REST TIMER ·
             TODAY · LOGGING · SCHEDULE · ROUTINES · BOXING · HISTORY ·
             CHARTS · HEALTH · BACKUP · SETTINGS · SHEETS · BOOT
   ========================================================================== */

/* ---- STATE ---- */

const KEY = 'gym.v1';
const REST_KEY = 'gym.rest';

const DEFAULTS = () => ({
  version: 1,
  // Exercise names are kept exactly as they were written in the Notes doc these
  // came from, typos included ("Shoudler", "Skill Crusher"), so the history that
  // was imported keeps matching them. Rename freely in Settings → Routines; the
  // logged sets carry a denormalised name and survive it.
  routines: [
    { id:'a', name:'Arms & Back', subtitle:'Bicep · Tricep · Back', exercises:[
      // back
      'Seated Row (Middle Back Pull)','Lat Pull Downs','Face Pulls',
      'Rear Delt Machine','Rear Delt Single Cable','Shrugs DB',
      // biceps
      'Cable Bicep Curl','Dumbbell Hammer Curl','Long Head Rear Bicep Cable Curl',
      'Incline Bicep Curl (Long Head)','Short Head Between Legs Curl',
      'Preacher Curl','Preacher DB Curl',
      // triceps
      'Cable Tricep Pressdown','Overhead Tricep Extension (Cable)',
      'Tricep Push Up Behind','Tricep DB Overhead Press','Skill Crusher',
      'Normal triceps push down','Tricep Pushdown Cables'
    ].map((n,i)=>({ id:'a'+(i+1), name:n })) },
    { id:'b', name:'Chest & Legs', subtitle:'Chest · Shoulder · Leg', exercises:[
      // chest
      'Chest Fly (Normal Machine)','Chest Fly Machine (Alternative one)',
      'Chest Press Machine','Dumbbell Incline Press','Dips',
      // shoulders
      'Dumbbell Shoulder Press','Shoulder Press Machine',
      'Shoudler Lateral Raise Machine','Cable Lateral Raise','Front felt cable raises',
      // legs
      'Hamstring Curl Machine','Leg Extension (new)'
    ].map((n,i)=>({ id:'b'+(i+1), name:n })) }
  ],
  schedule: { 0:null, 1:'a', 2:null, 3:'b', 4:null, 5:'a', 6:'b' },
  sessions: [],
  settings: {
    unit:'kg',
    reminderTime:'07:00',
    maxHr:190,
    boxing:{ workSec:180, restSec:60, rounds:6 },
    quickRestSec:180,
    backupAt:0
  }
});

let S = null;
let loadFailed = false;

/* ---- STORAGE ---- */

function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); }
  catch(e){ loadFailed = true; return DEFAULTS(); }
  if(!raw) return DEFAULTS();
  try { return migrate(JSON.parse(raw)); }
  catch(e){
    console.error('gym: store unreadable', e);
    loadFailed = true;
    try { localStorage.setItem(KEY + '.broken.' + Date.now(), raw); } catch(_){}
    return DEFAULTS();
  }
}

// Tolerant of anything missing — a half-written store must still boot.
function migrate(p){
  const d = DEFAULTS();
  if(!p || typeof p !== 'object') return d;
  const out = {
    version: 1,
    routines: Array.isArray(p.routines) && p.routines.length ? p.routines : d.routines,
    schedule: (p.schedule && typeof p.schedule === 'object') ? p.schedule : d.schedule,
    sessions: Array.isArray(p.sessions) ? p.sessions : [],
    settings: Object.assign({}, d.settings, p.settings || {})
  };
  out.settings.boxing = Object.assign({}, d.settings.boxing, (p.settings||{}).boxing || {});
  out.routines = out.routines.map((r,i)=>({
    id: r.id || 'r' + i,
    name: r.name || 'Routine',
    subtitle: r.subtitle || '',
    exercises: (Array.isArray(r.exercises) ? r.exercises : []).map((e,j)=>({
      id: e.id || 'e' + i + j, name: e.name || 'Exercise'
    }))
  }));
  out.sessions = out.sessions.filter(s => s && s.date).map(s => ({
    id: s.id || 's_' + s.date,
    date: s.date,
    routineId: s.routineId ?? null,
    startedAt: s.startedAt || null,
    endedAt: s.endedAt || null,
    finished: !!s.finished,
    hr: s.hr || null,
    entries: (Array.isArray(s.entries) ? s.entries : []).map(e => ({
      exerciseId: e.exerciseId || null,
      exerciseName: e.exerciseName || 'Exercise',
      sets: (Array.isArray(e.sets) ? e.sets : []).map(x => ({
        weight: Number(x.weight) || 0, reps: Number(x.reps) || 0
      }))
    }))
  }));
  return out;
}

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ toast('Could not save — storage may be full'); console.error(e); }
  }, 60);
}

/* ---- UTIL ---- */

const $  = (sel, r=document) => r.querySelector(sel);
const $$ = (sel, r=document) => Array.from(r.querySelectorAll(sel));

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for(const k in (attrs||{})){
    const v = attrs[k];
    if(v === null || v === undefined || v === false) continue;
    if(k === 'class') n.className = v;
    else if(k === 'html') n.innerHTML = v;
    else if(k === 'text') n.textContent = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for(const kid of kids.flat()){
    if(kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
}

const pad2 = n => String(n).padStart(2,'0');
const DAYS  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY3  = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MON3  = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function localDate(d = new Date()){
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function parseDate(k){
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y, m-1, d);
}
function clock(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + pad2(s);
}
function dur(ms){
  if(!ms || ms < 0) return '—';
  const m = Math.round(ms/60000);
  return m < 60 ? m + 'm' : Math.floor(m/60) + 'h ' + pad2(m%60) + 'm';
}
function nice(n){
  if(!isFinite(n)) return '0';
  return (Math.round(n*10)/10).toLocaleString('en-AU');
}
const unit = () => S.settings.unit;
const e1rm = s => (s.weight||0) * (1 + (s.reps||0)/30);   // Epley

function toast(msg, ms=2200){
  $$('.toast').forEach(t=>t.remove());
  const t = el('div', { class:'toast', text:msg });
  document.body.append(t);
  setTimeout(()=>t.remove(), ms);
}

function haptic(ms=18){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

// <main> is the scroll container now, not the document.
function scrollTop(){ const m = $('main'); if(m) m.scrollTop = 0; }

/* ---- AUDIO ----
   Generated tones only, no files, so it still works offline. The context has to
   be created (and resumed) inside a user gesture or iOS keeps it suspended. */

let actx = null;
function audio(){
  if(!actx){
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    actx = new C();
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, len=0.16, when=0, vol=0.28, type='sine'){
  const a = audio(); if(!a) return;
  const t0 = a.currentTime + when;
  const osc = a.createOscillator(), g = a.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
  osc.connect(g).connect(a.destination);
  osc.start(t0); osc.stop(t0 + len + 0.02);
}
const cue = {
  work(){ tone(880,.16,0,.3,'square'); tone(1180,.2,.13,.3,'square'); },
  rest(){ tone(420,.34,0,.26,'sine'); },
  tick(){ tone(680,.09,0,.22,'square'); },
  done(){ tone(880,.18,0,.3); tone(660,.18,.17,.3); tone(440,.42,.34,.3); },
  ping(){ tone(1046,.14,0,.3); tone(1568,.26,.12,.28); }
};
document.addEventListener('pointerdown', () => audio(), { once:true });

/* ---- NO ZOOM ----
   The viewport meta asks for it, but iOS Safari ignores user-scalable on its own,
   so pinch has to be refused directly. Text sizes are fixed, so nothing needs
   zooming to be readable. */
['gesturestart','gesturechange','gestureend'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
// Belt and braces for double-tap zoom, which touch-action alone misses on older iOS.
let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - lastTap < 300) e.preventDefault();
  lastTap = now;
}, { passive:false });

/* ---- WAKE LOCK ---- */

let wake = null;
async function wakeOn(){
  try { if('wakeLock' in navigator && !wake) wake = await navigator.wakeLock.request('screen'); }
  catch(e){ /* denied or unsupported — the on-screen warning covers it */ }
}
async function wakeOff(){
  try { await (wake && wake.release()); } catch(e){}
  wake = null;
}
const needsWake = () => box.running || rest.endsAt !== null;
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    if(needsWake()){ wake = null; wakeOn(); }
    paintRest(); paintBox();
  }
});

/* ---- REST TIMER ----
   Driven off an absolute end timestamp, never a decrementing counter, so it
   survives backgrounding and reloads without drifting. */

let rest = { endsAt:null, total:0 };

function restLoad(){
  try {
    const r = JSON.parse(localStorage.getItem(REST_KEY) || 'null');
    if(r && r.endsAt && r.endsAt > Date.now()) rest = r;
  } catch(e){}
}
function restSave(){
  try {
    if(rest.endsAt) localStorage.setItem(REST_KEY, JSON.stringify(rest));
    else localStorage.removeItem(REST_KEY);
  } catch(e){}
}
function restStart(sec){
  sec = sec || S.settings.quickRestSec || 180;
  rest = { endsAt: Date.now() + sec*1000, total: sec };
  restSave(); wakeOn(); paintRest(); haptic();
}
function restStop(){
  rest = { endsAt:null, total:0 };
  restSave(); if(!needsWake()) wakeOff(); paintRest();
}
let restFired = false;
function paintRest(){
  const bar = $('#restBar'), t = $('#restTime'), l = $('#restLabel');
  if(!rest.endsAt){
    bar.classList.remove('on');
    t.textContent = clock(S.settings.quickRestSec || 180);
    l.textContent = 'Rest — tap to start';
    restFired = false;
    return;
  }
  const left = (rest.endsAt - Date.now())/1000;
  if(left <= 0){
    if(!restFired){ restFired = true; cue.ping(); haptic([60,40,60]); toast('Rest done'); }
    restStop();
    return;
  }
  bar.classList.add('on');
  t.textContent = clock(left);
  l.textContent = 'Tap to reset';
  if(left <= 3.02 && left > 2.98) cue.tick();
}
$('#restBar').addEventListener('click', e => {
  const p = e.target.closest('.preset');
  if(p){ e.stopPropagation(); restStart(+p.dataset.s); return; }
  rest.endsAt ? restStop() : restStart();
});

/* ---- SESSIONS ---- */

function routine(id){ return S.routines.find(r => r.id === id) || null; }

// schedule keys survive a JSON round trip as strings; obj[1] and obj['1'] are
// the same property, so read through one place and stop worrying about it.
function schedFor(dayIndex){ return S.schedule[dayIndex] ?? null; }
function trainingDays(){ return [0,1,2,3,4,5,6].filter(d => schedFor(d)); }
function sessionOn(date){ return S.sessions.find(s => s.date === date) || null; }

function ensureSession(date, routineId){
  let s = sessionOn(date);
  if(!s){
    s = { id:'s_'+Date.now(), date, routineId: routineId ?? null,
          startedAt:null, endedAt:null, finished:false, hr:null, entries:[] };
    S.sessions.push(s);
  }
  if(routineId !== undefined && routineId !== null && !s.routineId) s.routineId = routineId;
  return s;
}
function entryFor(s, ex){
  let e = s.entries.find(x => (ex.id && x.exerciseId === ex.id) || x.exerciseName === ex.name);
  if(!e){ e = { exerciseId: ex.id || null, exerciseName: ex.name, sets:[] }; s.entries.push(e); }
  return e;
}
function volume(s){
  return s.entries.reduce((t,e) => t + e.sets.reduce((u,x)=>u + (x.weight||0)*(x.reps||0), 0), 0);
}
function setCount(s){ return s.entries.reduce((t,e)=>t + e.sets.length, 0); }

// `endedAt` is stamped on every set, so an unfinished session still has an
// honest duration. While it is live the clock runs; a session left open is
// treated as finished after two hours of nothing, so forgetting to tap Finish
// can never show "7h" the next morning.
const STALE = 2*3600*1000;
function sessionFinished(s){
  return !!(s && (s.finished || (s.endedAt && Date.now() - s.endedAt > STALE)));
}
function sessionElapsed(s){
  if(!s || !s.startedAt) return 0;
  return sessionFinished(s) ? (s.endedAt || s.startedAt) - s.startedAt : Date.now() - s.startedAt;
}

// Most recent session before `before` that has real sets for this exercise.
function lastTime(ex, before){
  const list = S.sessions
    .filter(s => s.date < before)
    .sort((a,b) => b.date.localeCompare(a.date));
  for(const s of list){
    const e = s.entries.find(x => (ex.id && x.exerciseId === ex.id) || x.exerciseName === ex.name);
    if(e && e.sets.length) return { session:s, entry:e };
  }
  return null;
}
function allExerciseNames(){
  const set = new Set();
  S.routines.forEach(r => r.exercises.forEach(e => set.add(e.name)));
  S.sessions.forEach(s => s.entries.forEach(e => e.sets.length && set.add(e.exerciseName)));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function bestEver(name, excludeSessionId){
  let best = 0;
  for(const s of S.sessions){
    if(s.id === excludeSessionId) continue;
    const e = s.entries.find(x => x.exerciseName === name);
    if(e) for(const x of e.sets) best = Math.max(best, x.weight||0);
  }
  return best;
}
function setsLine(sets){
  return sets.map(x => nice(x.weight) + '×' + x.reps).join(' · ');
}

/* ---- TARGETS ----
   Double progression, read off your own history rather than a generic template.
   No AI and no network: the numbers you have already lifted contain everything
   needed, and a formula gives the same answer in a gym basement with no signal.

     - hit the top of your rep range on every set  ->  add one weight step
     - otherwise                                  ->  same weight, one more rep

   The weight step is YOUR usual jump for that exercise (the most common increase
   in its history), so cable stacks move 1.25 and machines move 5, automatically. */

// Percentile of a sorted-in-place copy. Used instead of max() so one freak
// session cannot set a bar you never reach again.
function pct(values, p){
  if(!values.length) return 0;
  const v = [...values].sort((a,b)=>a-b);
  const i = Math.min(v.length-1, Math.max(0, Math.round((v.length-1) * p)));
  return v[i];
}

// Your usual jump for this lift: the MEDIAN increase in its history, not the
// smallest. The smallest is often a one-off half-plate that would stall you.
function stepFor(name){
  const d = series(name, 'top');
  const ups = [];
  for(let i=1;i<d.length;i++){
    const x = Math.round((d[i].value - d[i-1].value) * 100) / 100;
    if(x > 0 && x <= 10) ups.push(x);
  }
  if(!ups.length) return 2.5;
  const med = pct(ups, 0.5);
  return Math.min(5, Math.max(0.5, Math.round(med * 4) / 4));
}

// Top of the rep range is the 75th percentile of what you actually hit — a
// number you reach often, not your all-time best.
function repRange(name){
  const all = [];
  S.sessions.forEach(s => {
    const e = s.entries.find(x => x.exerciseName === name);
    if(e) e.sets.forEach(x => { if(x.reps > 0) all.push(x.reps); });
  });
  if(!all.length) return { bottom:8, top:12 };
  const top = Math.min(15, Math.max(8, pct(all, 0.75)));
  return { bottom: Math.max(5, top - 4), top };
}

function targetFor(ex, dateKey){
  const last = lastTime(ex, dateKey);
  if(!last) return null;
  const sets = last.entry.sets.filter(s => s.reps > 0);
  if(!sets.length) return null;

  const w = Math.max(...sets.map(s => s.weight || 0));
  const reps = sets.map(s => s.reps);
  const { bottom, top } = repRange(ex.name);
  const step = stepFor(ex.name);
  const n = Math.min(3, Math.max(2, reps.length));

  if(Math.min(...reps) >= top){
    return {
      weight: Math.round((w + step) * 100) / 100,
      reps: Array(n).fill(bottom),
      increase: true,
      reason: 'You hit ' + top + ' on every set last time — go up ' + nice(step) + unit() +
              ' and rebuild from ' + bottom + ' reps.'
    };
  }

  const out = reps.slice();
  let idx = 0;
  for(let i=1;i<out.length;i++) if(out[i] < out[idx]) idx = i;
  out[idx] = Math.min(top, out[idx] + 1);
  return {
    weight: w,
    reps: out,
    increase: false,
    reason: 'Same weight. One more rep on set ' + (idx+1) + '. Reach ' + top +
            ' across all sets and the weight goes up ' + nice(step) + unit() + '.'
  };
}

/* ---- WEEK ----
   The main screen is the training week. Drag a workout pill onto another day to
   move it (dropping onto a day that already has one swaps them); tap a pill to
   cycle it; tap a row to open that day's exercises inline. Today is expanded by
   default so logging a set is still two taps from launch. */

let dayView = null;   // when set, the Week tab shows that day's exercise list

// Monday-first week containing today — a training week reads better than a
// calendar week starting on Sunday.
function weekDays(){
  const now = new Date(); now.setHours(0,0,0,0);
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const out = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    out.push({
      idx: d.getDay(),
      date: localDate(d),
      label: DAY3[d.getDay()],
      isToday: d.getTime() === now.getTime(),
      isFuture: d.getTime() > now.getTime(),
      routineId: schedFor(d.getDay())
    });
  }
  return out;
}

function renderToday(){
  const root = $('#s-today');
  root.innerHTML = '';

  if(dayView){ renderDayScreen(root, dayView); return; }

  const now = new Date();
  const week = weekDays();
  const today = localDate(now);

  root.append(bannerStack());

  const n = trainingDays().length;
  root.append(el('div', { class:'today-head' },
    el('div', { class:'micro' }, DAYS[now.getDay()].toUpperCase() + ' · ' + now.getDate() + ' ' + MON3[now.getMonth()]),
    el('h1', { class:'title', style:'margin-top:6px' }, 'This week'),
    el('div', { class:'sub', style:'margin-top:4px' },
      n + ' training day' + (n===1?'':'s') + ' · drag to move, tick when done')
  ));

  const list = el('div', { class:'week' });
  week.forEach(day => list.append(weekRow(day)));
  root.append(list);
}

function weekRow(day){
  const r = routine(day.routineId);
  const sess = sessionOn(day.date);
  const sets = sess ? setCount(sess) : 0;
  const done = !!(sess && sess.finished);

  const pill = el('div', {
    class: 'pill' + (r ? '' : ' rest'),
    role:'button',
    'aria-label': (r ? r.name : 'Rest') + ' on ' + DAYS[day.idx] + ' — drag to move, tap to change',
    onpointerdown: e => pillDown(e, day)
  },
    r ? el('span', { class:'grip' }, el('i', {})) : null,
    el('span', {}, r ? r.name : 'Rest')
  );

  const tick = el('button', {
    class:'tick' + (done ? ' on' : ''),
    disabled: (!r || day.isFuture) ? 'disabled' : null,
    'aria-label': done ? 'Mark not done' : 'Mark done',
    onclick: e => { e.stopPropagation(); toggleDone(day); }
  }, '✓');

  const head = el('div', { class:'wk-head', onclick: e => {
    if(e.target.closest('.pill') || e.target.closest('.tick')) return;
    dayView = day.date;
    renderToday();
    scrollTop();
  }},
    el('span', { class:'wk-d' }, day.label),
    el('span', { class:'wk-mid' }, pill,
      sets ? el('span', { class:'wk-badge' }, sets + ' set' + (sets===1?'':'s')) : null),
    tick,
    el('span', { class:'wk-chev' }, '›')
  );

  return el('div', {
    class:'wk' + (day.isToday ? ' today' : ''),
    'data-idx': day.idx
  }, head);
}

// The tick is the "I trained" switch: it files the day into History even when
// no individual sets were logged.
function toggleDone(day){
  if(day.routineId == null || day.isFuture) return;
  const existing = sessionOn(day.date);
  if(existing && existing.finished){
    existing.finished = false;
    toast('Unmarked');
  } else {
    const s = ensureSession(day.date, day.routineId);
    s.finished = true;
    if(!s.endedAt) s.endedAt = Date.now();
    cue.ping(); haptic(34);
    toast(routine(day.routineId).name + ' logged to History');
    maybeBackupNag();
  }
  save(); renderToday();
}

/* ---- DAY SCREEN ---- */

function renderDayScreen(root, dateKey){
  const d = parseDate(dateKey);
  const today = localDate();
  const sess = sessionOn(dateKey);
  const rid = (sess && sess.routineId) || schedFor(d.getDay());
  const r = routine(rid);
  const sets = sess ? setCount(sess) : 0;

  root.append(el('button', { class:'back', onclick:()=>{ dayView = null; renderToday(); } },
    el('i', {}, '‹'), 'This week'));

  root.append(el('div', {},
    el('div', { class:'micro' }, DAYS[d.getDay()].toUpperCase() + ' · ' + d.getDate() + ' ' + MON3[d.getMonth()] +
      (dateKey === today ? ' · TODAY' : '')),
    el('h1', { class:'title', style:'margin-top:6px' }, r ? r.name : 'Rest day'),
    r && r.subtitle ? el('div', { class:'sub', style:'margin-top:4px' }, r.subtitle) : null
  ));

  if(!r){
    root.append(el('div', { class:'card rest-day', style:'margin-top:18px' },
      el('div', { class:'big' }, 'Nothing scheduled'),
      el('div', { class:'sub', style:'margin-top:6px;margin-bottom:16px' }, 'Train anyway:'),
      el('div', { class:'row-btns' }, S.routines.map(x =>
        el('button', { class:'btn sm', style:'flex:1',
          onclick:()=>{ ensureSession(dateKey, x.id); save(); renderToday(); } }, x.name)
      ))
    ));
    return;
  }

  // Only what has actually been added to the day — build it up as you go rather
  // than wading past twenty rows you are not touching.
  const entries = sess ? sess.entries : [];
  const ups = entries.filter(e => {
    if(e.sets.length) return false;
    const t = targetFor({ id:e.exerciseId, name:e.exerciseName }, dateKey);
    return t && t.increase;
  }).length;

  root.append(el('div', { class:'stats' },
    el('div', { class:'stat' }, el('span',{class:'micro'},'Exercises'),
      el('div',{class:'v num'}, String(entries.length))),
    el('div', { class:'stat' }, el('span',{class:'micro'},'Sets'),
      el('div',{class:'v num'}, String(sets))),
    el('div', { class:'stat' }, el('span',{class:'micro'},'Volume'),
      el('div',{class:'v num'}, nice(sess ? volume(sess) : 0), el('span',{class:'u'}, unit())))
  ));

  if(!entries.length){
    root.append(el('div', { class:'card rest-day', style:'margin-top:14px' },
      el('div', { class:'big' }, 'Nothing added yet'),
      el('div', { class:'sub', style:'margin-top:6px' },
        'Add the lifts as you get to them. Targets are waiting for each one.')
    ));
  } else {
    const list = el('div', { class:'exs' });
    entries.forEach(e =>
      list.append(exerciseRow({ id:e.exerciseId, name:e.exerciseName }, sess, dateKey)));
    root.append(list);
  }

  root.append(el('button', {
    class:'btn' + (entries.length ? ' ghost' : ' primary'),
    style:'margin-top:' + (entries.length ? '10px' : '14px'),
    onclick:()=>openPicker(dateKey, rid)
  }, entries.length ? '+  Add another exercise' : '+  Add exercise'));

  if(ups) root.append(el('div', { class:'note' },
    el('b', {}, ups + (ups===1 ? ' lift is' : ' lifts are') + ' due a weight increase.')));

  root.append(el('button', { class:'btn', style:'margin-top:14px',
    onclick:()=>finishSession(dateKey) },
    (sess && sess.finished) ? 'Marked done · undo' : 'Mark this workout done'));

  if(sets){
    if(sess.hr) root.append(hrPanel(sess));
    else root.append(el('button', { class:'btn ghost', style:'margin-top:10px',
      onclick:()=>openHealth(dateKey) }, '♥  Import heart rate'));
  }
}

/* ---- EXERCISE PICKER ----
   The day's routine, grouped by muscle, with each lift's target alongside so
   the choice is informed. Picking one drops it onto the day and returns. */

// The most recent session of this routine that actually had sets logged.
function previousWorkout(rid, beforeDate){
  return [...S.sessions]
    .filter(s => s.date < beforeDate && s.entries.some(e => e.sets.length) &&
                 (rid ? s.routineId === rid : true))
    .sort((a,b) => b.date.localeCompare(a.date))[0] || null;
}

function openPicker(dateKey, rid){
  const r = routine(rid);
  const sess = sessionOn(dateKey);
  const already = new Set((sess ? sess.entries : []).map(e => e.exerciseName));
  const pool = (r ? r.exercises : []).filter(ex => !already.has(ex.name));

  const body = el('div');

  // Same exercises as last time, in the same order — one tap instead of six.
  const prev = previousWorkout(rid, dateKey);
  if(prev){
    const bring = prev.entries.filter(e => e.sets.length && !already.has(e.exerciseName));
    const pd = parseDate(prev.date);
    body.append(el('button', {
      class:'btn' + (bring.length ? ' primary' : ''),
      disabled: bring.length ? null : 'disabled',
      style:'flex-direction:column;gap:3px;min-height:60px',
      onclick:()=>{
        const s = ensureSession(dateKey, rid);
        bring.forEach(e => entryFor(s, { id:e.exerciseId, name:e.exerciseName }));
        save(); haptic(24); closeSheet(); renderToday();
        toast(bring.length + ' exercise' + (bring.length===1?'':'s') + ' brought in');
      }
    },
      el('span', {}, bring.length ? '⤓  Import previous workout' : 'Previous workout already added'),
      el('span', { style:'font-size:11.5px;font-weight:600;opacity:.72' },
        DAY3[pd.getDay()] + ' ' + pd.getDate() + ' ' + MON3[pd.getMonth()] + ' · ' +
        prev.entries.filter(e=>e.sets.length).length + ' exercises' +
        (bring.length && bring.length !== prev.entries.filter(e=>e.sets.length).length
          ? ' · ' + bring.length + ' to add' : ''))
    ));
    body.append(el('div', { class:'micro', style:'margin-top:10px;text-align:center' },
      'or pick individually'));
  }

  if(!pool.length){
    body.append(el('div', { class:'note' },
      r ? 'Every exercise in ' + r.name + ' is already on this day.'
        : 'No routine on this day yet.'));
  } else {
    const groups = new Map(MUSCLE_ORDER.map(m => [m, []]));
    pool.forEach(ex => groups.get(muscleOf(ex.name)).push(ex));

    MUSCLE_ORDER.forEach(m => {
      const list = groups.get(m);
      if(!list.length) return;
      body.append(el('div', { class:'sec-head', style:'margin-top:16px' },
        el('span',{class:'micro'}, m)));
      const box = el('div', { class:'lifts' });
      list.forEach(ex => {
        const t = targetFor(ex, dateKey);
        const last = lastTime(ex, dateKey);
        box.append(el('button', { class:'lift', onclick:()=>{
          const s = ensureSession(dateKey, rid);
          entryFor(s, ex);
          save(); haptic(16); closeSheet(); renderToday();
          toast(ex.name + ' added');
        }},
          el('span', { class:'lift-mid' },
            el('div', { class:'lift-nm' }, ex.name),
            el('div', { class:'lift-meta' },
              last ? setsLine(last.entry.sets) : 'no history yet')),
          t ? el('span', { class:'lift-w' },
                el('div', { class:'v num', style:'color:var(--cool);font-size:15px' },
                  nice(t.weight) + unit()),
                el('div', { class:'d num', style:'color:var(--cool)' }, t.reps.join(', '))) : null,
          t && t.increase ? el('span', { class:'ex-count', style:'color:var(--amp)' }, '↑')
                          : el('span', { class:'ex-count' }, '+')
        ));
      });
      body.append(box);
    });
  }

  body.append(el('button', { class:'btn ghost', style:'margin-top:16px',
    onclick:()=>addAdhoc(dateKey, rid) }, 'Something else…'));

  openSheet({ title:'Add exercise', body:[body] });
}

function exerciseRow(ex, s, dateKey){
  const e = s ? s.entries.find(x => (ex.id && x.exerciseId === ex.id) || x.exerciseName === ex.name) : null;
  const done = !!(e && e.sets.length);
  const last = lastTime(ex, dateKey);
  // Always computed, even once logged — the quick row colours each box against
  // it, so it has to survive saving. Only the TARGET text line is hidden.
  const target = targetFor(ex, dateKey);

  const lines = [];
  if(done){
    lines.push(el('div', { class:'ex-line today' },
      el('span',{class:'tag'}, 'DONE'), el('b', {}, setsLine(e.sets))));
  }
  if(last){
    lines.push(el('div', { class:'ex-line' },
      el('span',{class:'tag'},'LAST'), setsLine(last.entry.sets)));
  } else if(!done){
    lines.push(el('div', { class:'ex-line' }, el('span',{class:'tag'},'LAST'), 'no history yet'));
  }
  if(target && !done){
    lines.push(el('div', { class:'ex-line goal' },
      el('span',{class:'tag'},'TARGET'),
      el('b', {}, nice(target.weight) + unit() + ' × ' + target.reps.join(', ')),
      target.increase ? el('span',{class:'up'}, ' ↑') : null));
  }

  // A div, not a button, because it contains its own controls and nesting
  // buttons is invalid.
  const card = el('div', {
    class:'ex' + (done ? ' done' : ''),
    onclick: ev => {
      if(ev.target.closest('.ex-x') || ev.target.closest('.qrow')) return;
      openLog(ex, dateKey);
    }
  },
    el('div', { class:'ex-top', role:'button', tabindex:'0',
      onkeydown: ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); openLog(ex, dateKey); } } },
      el('span', { class:'ex-mark' }),
      el('span', { class:'ex-body' }, el('span', { class:'ex-name' }, ex.name), lines),
      done ? el('span', { class:'ex-count' }, String(e.sets.length)) : null,
      el('button', { class:'ex-x', 'aria-label':'Remove ' + ex.name + ' from this day',
        onclick: ev => { ev.stopPropagation(); removeFromDay(ex, dateKey); } }, '×')
    )
  );

  card.append(quickRow(ex, e, dateKey, target));
  return card;
}

/* ---- QUICK SET ROW ---- */

// Swipe a box up or down to change it; releasing saves the whole line. A plain
// tap with no movement commits whatever is shown, which is how the prefilled
// target gets accepted without touching a single number.
function quickDrag(box, get, set, step, min, max, onCommit){
  const PX = 9;
  box.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    const startY = e.clientY, start = get();
    let moved = false, last = start;
    const move = ev => {
      const d = startY - ev.clientY;
      if(!moved && Math.abs(d) < 4) return;
      if(!moved){ moved = true; box.classList.add('drag'); }
      let v = Math.min(max, Math.max(min, Math.round((start + Math.round(d / PX) * step) * 100) / 100));
      if(v !== last){ last = v; set(v); haptic(6); }
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      box.classList.remove('drag');
      onCommit();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    try { box.setPointerCapture(e.pointerId); } catch(_){}
  });
}

function quickRow(ex, e, dateKey, target){
  const saved = !!(e && e.sets.length);
  // Saved numbers if there are any, otherwise the target, waiting to be accepted.
  const vals = {
    w: saved ? e.sets[0].weight : (target ? target.weight : 0),
    r: [0,1,2].map(i => saved ? (e.sets[i] ? e.sets[i].reps : 0)
                              : (target ? (target.reps[i] || 0) : 0))
  };

  const row = el('div', { class:'qrow' });
  const boxes = [];

  // Colour is a comparison against the target, not a saved/unsaved flag: blue
  // while a box still reads the target number, amber once it differs.
  const paint = () => boxes.forEach((b,i) => {
    const v  = i === 0 ? vals.w : vals.r[i-1];
    const tv = target ? (i === 0 ? target.weight : (target.reps[i-1] || 0)) : null;
    b.num.textContent = i === 0 ? nice(v) : String(v);
    const onTarget = tv !== null && Math.abs(v - tv) < 0.001;
    b.box.classList.toggle('zero', !v);
    b.box.classList.toggle('at-target', !!v && onTarget);
    b.box.classList.toggle('changed', !!v && tv !== null && !onTarget);
  });

  const commit = () => {
    const reps = vals.r.filter(r => r > 0);
    if(!reps.length){ toast('No reps to save'); return; }
    const s = ensureSession(dateKey, (sessionOn(dateKey)||{}).routineId ?? currentRoutineId());
    const entry = entryFor(s, ex);
    const before = setsLine(entry.sets);
    entry.sets = reps.map(r => ({ weight: vals.w, reps: r }));
    if(setsLine(entry.sets) === before) return;      // nothing actually changed
    touchSession(s); save();
    haptic(22); cue.tick();
    if(S.settings.quickRestSec > 0) restStart(S.settings.quickRestSec);
    renderToday();
  };

  const mk = (key, label, get, set, step, min, max) => {
    const num = el('span', { class:'n' });
    const box = el('div', { class:'qbox' }, el('span', { class:'k' }, label), num);
    quickDrag(box, get, v => { set(v); paint(); }, step, min, max, commit);
    boxes.push({ box, num });
    row.append(box);
  };

  mk('w', unit(), () => vals.w, v => vals.w = v, stepFor(ex.name), 0, 999);
  [0,1,2].forEach(i =>
    mk('r'+i, 'set ' + (i+1), () => vals.r[i], v => vals.r[i] = v, 1, 0, 99));

  paint();

  const wrap = el('div');
  wrap.append(row);
  if(!saved && target) wrap.append(el('div', { class:'qhint' }, 'swipe to adjust · tap to save as shown'));
  return wrap;
}

function removeFromDay(ex, dateKey){
  const s = sessionOn(dateKey); if(!s) return;
  const i = s.entries.findIndex(x => (ex.id && x.exerciseId === ex.id) || x.exerciseName === ex.name);
  if(i < 0) return;
  const drop = () => {
    s.entries.splice(i, 1);
    if(!s.entries.length && !s.finished) S.sessions = S.sessions.filter(x => x !== s);
    save(); renderToday(); renderExercises(); haptic(14);
  };
  if(s.entries[i].sets.length){
    confirmSheet('Remove ' + ex.name + '?',
      'It has ' + s.entries[i].sets.length + ' set' + (s.entries[i].sets.length===1?'':'s') +
      ' logged against this day. Those numbers go with it.', drop);
  } else drop();
}

/* ---- DRAG A WORKOUT BETWEEN DAYS ----
   Pointer events, not HTML5 drag-and-drop, because iOS Safari does not fire
   dragstart from touch. touch-action:none on the pill stops the page scrolling
   under the finger mid-drag. */

let drag = null;

function pillDown(e, day){
  if(e.button !== undefined && e.button !== 0) return;
  const pill = e.currentTarget;
  if(day.routineId == null){          // nothing to drag off a rest day — tap to set one
    drag = { from: day.idx, pill, moved: false, over: null, ghost: null };
  } else {
    const r = pill.getBoundingClientRect();
    const ghost = pill.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.style.width = r.width + 'px';
    ghost.style.left = r.left + 'px';
    ghost.style.top = r.top + 'px';
    document.body.append(ghost);
    drag = { from: day.idx, pill, ghost, moved: false, over: null,
             ox: e.clientX - r.left, oy: e.clientY - r.top };
  }
  e.preventDefault();
  // Capture keeps the events coming if the finger leaves the pill, but it is a
  // nicety — listeners go on window so a failed capture cannot strand the drag.
  try { pill.setPointerCapture(e.pointerId); } catch(_){}
  window.addEventListener('pointermove', pillMove);
  window.addEventListener('pointerup', pillUp);
  window.addEventListener('pointercancel', pillUp);
}

function pillMove(e){
  if(!drag) return;
  if(!drag.ghost) return;                       // rest pill: tap only
  if(!drag.moved){
    drag.moved = true;
    drag.pill.classList.add('dragging');
    haptic(12);
  }
  drag.ghost.style.left = (e.clientX - drag.ox) + 'px';
  drag.ghost.style.top  = (e.clientY - drag.oy) + 'px';

  // Which row is the finger over? Measured directly against each row's box
  // rather than elementFromPoint — the finger is usually over the ghost, and
  // hit-testing through a dragged element is unreliable on touch.
  drag.over = null;
  $$('.wk').forEach(n => {
    n.classList.remove('drop');
    const b = n.getBoundingClientRect();
    if(e.clientY >= b.top && e.clientY <= b.bottom && +n.dataset.idx !== drag.from){
      n.classList.add('drop');
      drag.over = +n.dataset.idx;
    }
  });
}

function pillUp(){
  if(!drag) return;
  const { from, over, moved, ghost } = drag;
  window.removeEventListener('pointermove', pillMove);
  window.removeEventListener('pointerup', pillUp);
  window.removeEventListener('pointercancel', pillUp);
  if(ghost) ghost.remove();
  $$('.wk').forEach(n => n.classList.remove('drop'));
  drag = null;

  if(moved && over !== null && over !== from){
    // Swap, which doubles as a plain move when the target day is a rest day.
    const a = schedFor(from), b = schedFor(over);
    S.schedule[over] = a;
    S.schedule[from] = b;
    save(); haptic(28); toast(routine(a).name + ' → ' + DAYS[over]);
  } else if(!moved){
    cycleDay(from); haptic();
  }
  renderToday();
}

function finishSession(date){
  const s = sessionOn(date); if(!s) return;
  if(s.finished){ s.finished = false; toast('Session reopened'); }
  else {
    s.finished = true;
    s.endedAt = Date.now();
    if(!s.startedAt) s.startedAt = s.endedAt;
    cue.ping(); haptic(40);
    toast('Logged ' + setCount(s) + ' sets · ' + nice(volume(s)) + unit());
    maybeBackupNag();
  }
  save(); renderToday();
}

/* ---- LOGGING ----
   The whole app lives or dies here. Opening prefilled with the previous set
   means a repeat set costs two taps: the row, then ADD SET. */

/* ---- LOGGING ----
   Four boxes, matching the way the numbers were always written down: one weight,
   then reps for set 1, 2 and 3. Drag a box up or down to change its number, or
   tap it to type. Save writes the whole line at once. A set left at 0 is simply
   not recorded, so a two-set day needs nothing extra. */

// Drag vertically to change a number; a tap with no movement focuses for typing.
function dragNumber(box, input, step, min, max, onChange){
  const PX = 9;                                     // pixels of drag per step
  box.addEventListener('pointerdown', e => {
    if(box.classList.contains('typing')) return;
    const startY = e.clientY;
    const start = +input.value || 0;
    let moved = false, lastV = start;
    const move = ev => {
      const steps = Math.round((startY - ev.clientY) / PX);
      if(!moved && Math.abs(startY - ev.clientY) < 4) return;
      if(!moved){ moved = true; box.classList.add('drag'); }
      let v = start + steps * step;
      v = Math.min(max, Math.max(min, Math.round(v * 100) / 100));
      if(v !== lastV){
        lastV = v;
        input.value = String(v);
        haptic(7);
        onChange && onChange();
      }
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      box.classList.remove('drag');
      if(!moved){                                   // a tap — let them type
        box.classList.add('typing');
        input.focus(); input.select();
        const off = () => { box.classList.remove('typing'); input.removeEventListener('blur', off); onChange && onChange(); };
        input.addEventListener('blur', off);
      }
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    try { box.setPointerCapture(e.pointerId); } catch(_){}
    e.preventDefault();
  });
}

function numBox(label, unitLabel, value, step, min, max, mode, onChange){
  const input = el('input', { class:'num', inputmode:mode, enterkeyhint:'done', value:String(value) });
  const box = el('div', { class:'wbox' + (value ? '' : ' off') },
    el('span', { class:'micro' }, label),
    el('span', { class:'arrows' }, '▲', el('br'), '▼'),
    input,
    el('span', { class:'u' }, unitLabel)
  );
  const sync = () => {
    let v = Math.min(max, Math.max(min, Math.round((+input.value || 0) * 100) / 100));
    input.value = String(v);
    box.classList.toggle('off', !v);
    onChange && onChange();
  };
  input.addEventListener('change', sync);
  input.addEventListener('keydown', ev => { if(ev.key === 'Enter'){ ev.preventDefault(); input.blur(); } });
  dragNumber(box, input, step, min, max, () => {
    box.classList.toggle('off', !(+input.value));
    onChange && onChange();
  });
  return { box, input, val: () => +input.value || 0 };
}

function openLog(ex, date){
  const s = ensureSession(date, (sessionOn(date)||{}).routineId ?? currentRoutineId());
  const e = entryFor(s, ex);
  const last = lastTime(ex, date);
  const pr = bestEver(ex.name, s.id);

  // Prefill: what is already saved today, else last time's line.
  const src = e.sets.length ? e.sets : (last ? last.entry.sets : []);
  const w0 = src.length ? src[0].weight : 0;
  const r0 = [0,1,2].map(i => src[i] ? src[i].reps : 0);

  const summary = el('div', { class:'hint-drag' });
  const repaint = () => {
    const reps = [b1,b2,b3].map(b => b.val()).filter(r => r > 0);
    summary.textContent = reps.length
      ? nice(weightBox.val()) + unit() + ' × ' + reps.join(', ') +
        '   (' + reps.length + (reps.length===1?' set)':' sets)')
      : 'Set at least one set of reps';
  };

  const weightBox = numBox('Weight', unit(), w0, 1.25, 0, 999, 'decimal', () => repaint());
  const b1 = numBox('Set 1', 'reps', r0[0], 1, 0, 99, 'numeric', () => repaint());
  const b2 = numBox('Set 2', 'reps', r0[1], 1, 0, 99, 'numeric', () => repaint());
  const b3 = numBox('Set 3', 'reps', r0[2], 1, 0, 99, 'numeric', () => repaint());

  const refBox = el('div');

  // Target first — it is the number he is actually here to beat.
  const target = targetFor(ex, date);
  if(target){
    refBox.append(el('div', { class:'ref goal' },
      el('div', {},
        el('b', {}, 'Target  '),
        nice(target.weight) + unit() + ' × ' + target.reps.join(', '),
        target.increase ? el('span',{class:'up'}, '  ↑ up ' + nice(target.weight - Math.max(...last.entry.sets.map(s=>s.weight||0))) + unit()) : null),
      el('div', { class:'why' }, target.reason),
      el('button', { class:'btn sm', style:'margin-top:9px', onclick:()=>{
        weightBox.input.value = String(target.weight);
        [b1,b2,b3].forEach((b,i) => b.input.value = String(target.reps[i] || 0));
        [weightBox,b1,b2,b3].forEach(b => b.box.classList.toggle('off', !(+b.input.value)));
        repaint(); haptic(14);
      }}, 'Use target')
    ));
  }

  if(last){
    const d = parseDate(last.session.date);
    refBox.append(el('div', { class:'ref' },
      el('b', {}, 'Last · ' + DAY3[d.getDay()] + ' ' + d.getDate() + ' ' + MON3[d.getMonth()] + '  '),
      setsLine(last.entry.sets)));
  }
  if(pr) refBox.append(el('div', { class:'ref' }, el('b',{},'Best ever  '), nice(pr) + unit()));
  if(e.sets.length) refBox.append(el('div', { class:'ref' },
    el('b',{},'Saved today  '), setsLine(e.sets)));

  repaint();

  const doSave = () => {
    const weight = weightBox.val();
    const reps = [b1,b2,b3].map(b => b.val()).filter(r => r > 0);
    if(!reps.length){ toast('Set at least one set of reps'); return; }
    e.sets = reps.map(r => ({ weight, reps:r }));    // the line replaces itself
    touchSession(s); save();
    haptic(26); cue.tick();
    closeSheet(); renderToday(); renderExercises();
    toast(ex.name + ' · ' + nice(weight) + unit() + ' × ' + reps.join(', '));
    if(S.settings.quickRestSec > 0) restStart(S.settings.quickRestSec);
  };

  const body = [
    weightBox.box,
    el('div', { class:'sets3' }, b1.box, b2.box, b3.box),
    summary,
    refBox
  ];
  if(e.sets.length){
    body.push(el('button', { class:'btn danger', style:'margin-top:14px', onclick:()=>{
      e.sets = []; touchSession(s); save();
      closeSheet(); renderToday(); renderExercises(); toast('Cleared');
    }}, 'Clear this exercise'));
  }

  openSheet({
    title: ex.name,
    body,
    footer: el('button', { class:'btn primary huge', onclick:doSave }, 'SAVE')
  });
}

/* ---- BOXING TIMER ----
   Everything is derived from one start timestamp. setInterval only repaints;
   it never owns the count, so drift over a 30-minute session is impossible. */

let box = { running:false, startedAt:0, pausedAt:0, lost:0, lastKey:'', lastSec:-1 };
const PREP = 5;

function boxCfg(){ return S.settings.boxing; }
function boxTotal(c){ return PREP + c.rounds*c.workSec + (c.rounds-1)*c.restSec; }

function boxState(){
  const c = boxCfg();
  if(!box.running) return { phase:'idle', round:0, remain:c.workSec, total:boxTotal(c), elapsed:0 };
  const now = box.pausedAt || Date.now();
  const elapsed = (now - box.startedAt - box.lost)/1000;
  if(elapsed < PREP) return { phase:'prep', round:0, remain:PREP-elapsed, elapsed, total:boxTotal(c) };
  const t = elapsed - PREP;
  const cycle = c.workSec + c.restSec;
  const span = c.rounds*cycle - c.restSec;
  if(t >= span) return { phase:'done', round:c.rounds, remain:0, elapsed, total:boxTotal(c) };
  const round = Math.floor(t/cycle) + 1;
  const into = t % cycle;
  return into < c.workSec
    ? { phase:'work', round, remain:c.workSec-into, elapsed, total:boxTotal(c) }
    : { phase:'rest', round, remain:cycle-into, elapsed, total:boxTotal(c) };
}

function boxStart(){
  box = { running:true, startedAt:Date.now(), pausedAt:0, lost:0, lastKey:'', lastSec:-1 };
  audio(); wakeOn(); paintBox();
}
function boxPause(){
  if(!box.running || box.pausedAt) return;
  box.pausedAt = Date.now(); wakeOff(); paintBox();
}
function boxResume(){
  if(!box.pausedAt) return;
  box.lost += Date.now() - box.pausedAt;
  box.pausedAt = 0; wakeOn(); paintBox();
}
function boxStop(){
  box.running = false; box.pausedAt = 0;
  if(!needsWake()) wakeOff();
  paintBox();
}

function paintBox(){
  const root = $('#s-timer');
  if(!root.classList.contains('on') && !box.running) return;
  const c = boxCfg(), st = boxState();

  // Audio cues fire on transition, detected by comparing against the last paint.
  if(box.running && !box.pausedAt){
    const key = st.phase + st.round;
    if(key !== box.lastKey){
      if(box.lastKey){
        if(st.phase === 'work') cue.work();
        else if(st.phase === 'rest') cue.rest();
        else if(st.phase === 'done'){ cue.done(); haptic([80,60,80,60,120]); }
      }
      box.lastKey = key;
      box.lastSec = -1;
    }
    const secs = Math.ceil(st.remain);
    if(secs !== box.lastSec){
      if(secs <= 3 && secs >= 1 && (st.phase === 'work' || st.phase === 'rest' || st.phase === 'prep')) cue.tick();
      box.lastSec = secs;
    }
    if(st.phase === 'done'){ box.running = false; if(!needsWake()) wakeOff(); }
  }

  const clockEl = $('#boxClock');
  if(!clockEl) return;
  clockEl.className = 'clock ' + st.phase;
  $('#boxPhase').textContent =
    st.phase === 'idle' ? 'Ready' :
    st.phase === 'prep' ? 'Get ready' :
    st.phase === 'work' ? 'Work' :
    st.phase === 'rest' ? 'Rest' : 'Complete';
  $('#boxBig').textContent = st.phase === 'done' ? '✓' : clock(st.remain);
  $('#boxRound').textContent = st.phase === 'idle' || st.phase === 'prep'
    ? c.rounds + ' × ' + clock(c.workSec) + ' work / ' + clock(c.restSec) + ' rest'
    : 'Round ' + Math.max(1, st.round) + ' of ' + c.rounds;

  const track = $('#boxTrack');
  track.innerHTML = '';
  for(let i=1;i<=c.rounds;i++){
    const cls = st.phase === 'done' || i < st.round ? 'done' : (i === st.round && st.phase !== 'idle' && st.phase !== 'prep' ? 'now' : '');
    track.append(el('i', { class:cls }));
  }

  const run = $('#boxRun'), pause = $('#boxPause');
  if(!box.running){ run.textContent = st.phase === 'done' ? 'Go again' : 'Start'; run.classList.add('primary'); pause.style.display = 'none'; }
  else { run.textContent = 'Stop'; run.classList.remove('primary'); pause.style.display = ''; pause.textContent = box.pausedAt ? 'Resume' : 'Pause'; }
}

function renderTimer(){
  const root = $('#s-timer');
  const c = boxCfg();
  root.innerHTML = '';
  root.append(el('h1', { class:'title' }, 'Rounds'));
  root.append(el('div', { class:'sub', style:'margin-top:4px' }, 'Boxing / interval timer'));

  root.append(el('div', { class:'clock', id:'boxClock', style:'margin-top:16px' },
    el('div', { class:'phase', id:'boxPhase' }, 'Ready'),
    el('div', { class:'big num', id:'boxBig' }, clock(c.workSec)),

  ));
  root.append(el('div', { class:'track', id:'boxTrack' }));

  root.append(el('div', { class:'row-btns', style:'margin-top:16px' },
    el('button', { class:'btn primary huge', id:'boxRun', onclick:()=>{
      box.running ? boxStop() : boxStart();
    }}, 'Start'),
    el('button', { class:'btn huge', id:'boxPause', style:'display:none', onclick:()=>{

  root.append(el('div', { class:'sec' },

  ));

        el('button', {

  ));
